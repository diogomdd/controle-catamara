  } else {
    guiadosFiltrados.forEach(e => {
      const comissaoRegistro = valorComissaoRegistro(e);
      const faturamentoRegistro = valorFaturamentoRegistro(e);

      totPaxGuias += Number(e.totalPax) || 0;
      totValorGuias = somarMoeda(totValorGuias, faturamentoRegistro);
      totAlmocoGuias += Number(e.almocaram) || 0;
      totComissaoGuias = somarMoeda(totComissaoGuias, comissaoRegistro);

      listaGuias.innerHTML += `
        <div class="bg-gray-50 p-3 rounded text-sm border-l-4 border-green-500">
          <div class="flex justify-between items-start gap-2 mb-1">
            <div>
              <div class="font-bold">${escaparHTML(e.guia)}</div>
              <div class="text-gray-500 text-xs">${e.data} ${e.hora || ''}</div>
            </div>
            <div class="flex gap-1">
              <button type="button" onclick="editarGuia('${e.id}')" class="bg-blue-600 text-white text-xs font-bold py-1 px-2 rounded">✏️ Alterar</button>
              <button type="button" onclick="excluirGuia('${e.id}')" class="btn-delete text-xs font-bold py-1 px-2 rounded">🗑️ Excluir</button>
            </div>
          </div>

          <div class="text-xs text-gray-600 mb-1">${escaparHTML(e.agencia)}</div>

          <div class="flex justify-between text-xs mb-1">
            <span>🚤 ${Number(e.adultos) || 0}+${Number(e.criancas) || 0}+${Number(e.bebes) || 0}+${Number(e.cortesia) || 0} = ${Number(e.totalPax) || 0}</span>
            <span class="font-bold text-green-600">${formatarMoeda(faturamentoRegistro)}</span>
          </div>

          <div class="text-xs font-semibold text-blue-700 mb-1">💳 Pagamento: ${escaparHTML(detalharPagamentoGuia(e.formaPagamento, e.valorPago))}</div>

          <div class="flex justify-between text-xs mb-2">
            <span>🍽️ ${Number(e.almocaram) || 0}</span>
            <span class="font-bold text-orange-600">${formatarMoeda(comissaoRegistro)}</span>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('total-guias-pax').innerText = totPaxGuias;
  document.getElementById('total-guias-valor').innerText = formatarMoeda(totValorGuias);
  document.getElementById('total-guias-almoco').innerText = totAlmocoGuias;
  document.getElementById('total-guias-comissao').innerText = formatarMoeda(totComissaoGuias);

  // Lista Barcos
  const listaBarcos = document.getElementById('lista-barcos');
  listaBarcos.innerHTML = '';

  let totPaxBarcos = 0;
  let totValorBarcos = 0;

  if (barcosFiltrados.length === 0) {
    listaBarcos.innerHTML = '<p class="text-gray-500 text-center text-sm">Nenhuma embarcação registrada nesta data.</p>';
  } else {
    barcosFiltrados.forEach(e => {
      const valorRepasse = arredondar2(Number(e.valorRepasse) || 0);

      totPaxBarcos += Number(e.totalPax) || 0;
      totValorBarcos = somarMoeda(totValorBarcos, valorRepasse);

      listaBarcos.innerHTML += `
        <div class="bg-gray-50 p-3 rounded text-sm border-l-4 border-blue-500">
          <div class="flex justify-between font-bold">
            <span>${escaparHTML(nomeCanonicoEmbarcacao(e.catamaran))}</span>
            <span class="text-gray-500 text-xs">${e.data} ${e.hora || ''}</span>
          </div>

          <div class="flex justify-between text-xs mb-2">
            <span>👨${Number(e.adultos) || 0} 🧒${Number(e.criancas) || 0} 👶${Number(e.bebes) || 0} 🎁${Number(e.cortesia) || 0} = ${Number(e.totalPax) || 0}</span>
            <span class="font-bold text-green-600">${formatarMoeda(valorRepasse)}</span>
          </div>

          <button onclick="excluirBarco('${e.id}')" class="w-full btn-delete text-xs py-1 rounded">🗑️ Excluir</button>
        </div>
      `;
    });
  }

  document.getElementById('total-barcos-pax').innerText = totPaxBarcos;
  document.getElementById('total-barcos-valor').innerText = formatarMoeda(totValorBarcos);

  // Relatórios Catamarãs
  const relCat = {};

  if (filtroTipoRelatorio !== 'comissao') {
    contasBarcos.forEach(e => {
      const catamaran = nomeCanonicoEmbarcacao(e.catamaran);

      if (!relCat[catamaran]) {
        relCat[catamaran] = { valor: 0, pax: 0, dias: {} };
      }

      if (!relCat[catamaran].dias[e.data]) {
        relCat[catamaran].dias[e.data] = { valor: 0, pax: 0, lancamentos: 0 };
      }

      const valor = arredondar2(Number(e.valorRepasse) || 0);
      const pax = Number(e.totalPax) || 0;

      relCat[catamaran].valor = somarMoeda(relCat[catamaran].valor, valor);
      relCat[catamaran].pax += pax;

      relCat[catamaran].dias[e.data].valor = somarMoeda(relCat[catamaran].dias[e.data].valor, valor);
      relCat[catamaran].dias[e.data].pax += pax;
      relCat[catamaran].dias[e.data].lancamentos += 1;
    });
  }

  const divCat = document.getElementById('rel-catamaras');

  if (filtroTipoRelatorio === 'comissao') {
    divCat.innerHTML = '<p class="text-gray-500 text-sm italic">Filtro ativo: Só Comissão</p>';
  } else if (Object.keys(relCat).length === 0) {
    divCat.innerHTML = '<p class="text-gray-500 text-sm">Nenhum registro no período.</p>';
  } else {
    divCat.innerHTML = Object.entries(relCat)
      .sort(([catA], [catB]) => catA.localeCompare(catB, 'pt-BR'))
      .map(([cat, dadosCat]) => {
        const diasDoCatamara = Object.entries(dadosCat.dias)
          .sort(([dataA], [dataB]) => dataB.localeCompare(dataA));

        const saldoDevedor = diasDoCatamara.reduce((saldo, [data, dia]) =>
          somarMoeda(saldo, obterResumoPagamentoDiario('catamara', cat, data, dia.valor).saldoRestante),
        0);

        const linhasDiarias = diasDoCatamara
          .map(([data, dia]) => renderizarLinhaPagamentoDiario(
            'catamara',
            cat,
            data,
            dia.valor,
            `${dia.pax} passageiros · ${dia.lancamentos} lançamento${dia.lancamentos === 1 ? '' : 's'}`
          ))
          .join('');

        return `
          <details class="group border-2 border-blue-200 rounded-xl p-3 mb-4 bg-white">
            <summary class="cursor-pointer list-none">
              <div>
                <div class="font-bold text-blue-800">🚤 ${escaparHTML(cat)}</div>
                <div class="text-xs text-gray-500">${dadosCat.pax} passageiros no período</div>
              </div>

              <div class="grid grid-cols-2 gap-2 mt-3">
                <div class="bg-blue-50 rounded-lg p-2">
                  <div class="text-xs text-gray-500">Total do período</div>
                  <div class="font-bold text-green-700">${formatarMoeda(dadosCat.valor)}</div>
                </div>
                <div class="${saldoDevedor > 0 ? 'bg-red-50' : 'bg-green-50'} rounded-lg p-2 text-right">
                  <div class="text-xs text-gray-500">Saldo devedor</div>
                  <div class="font-bold ${saldoDevedor > 0 ? 'text-red-600' : 'text-green-700'}">${formatarMoeda(saldoDevedor)}</div>
                </div>
              </div>

              <div class="text-xs text-blue-600 font-semibold mt-2">
                <span class="group-open:hidden">▼ Ver datas e marcar pagamentos</span>
                <span class="hidden group-open:inline">▲ Ocultar datas</span>
              </div>
            </summary>

            <div class="space-y-2 mt-3 pt-3 border-t border-blue-100">${linhasDiarias}</div>
          </details>
        `;
      }).join('');
  }

  // Relatórios Agências
  const relAge = {};

  if (filtroTipoRelatorio !== 'embarque') {
    contasGuias
      .filter(e => ehAgenciaComissionada(e.agencia))
      .forEach(e => {
        const agenciaComissionada = 'Jardas';

        if (!relAge[agenciaComissionada]) {
          relAge[agenciaComissionada] = {
            pax: 0,
            adultos: 0,
            criancas: 0,
            cortesias: 0,
            passagens: 0,
            comissao: 0,
            almocaram: 0,
            valorPago: 0,
            dias: {}
          };
        }

        if (!relAge[agenciaComissionada].dias[e.data]) {
          relAge[agenciaComissionada].dias[e.data] = {
            pax: 0,
            adultos: 0,
            criancas: 0,
            cortesias: 0,
            passagens: 0,
            comissao: 0,
            almocaram: 0,
            valorPago: 0,
            valorAdulto: 0,
            guias: []
          };
        }

        const pax = Number(e.totalPax) || 0;
        const adultos = Number(e.adultos) || 0;
        const criancas = Number(e.criancas) || 0;
        const cortesias = Number(e.cortesia) || 0;
        const passagens = valorFaturamentoRegistro(e);
        const comissao = valorComissaoRegistro(e);
        const almocaram = Number(e.almocaram) || 0;
        const valorPago = arredondar2(Number(e.valorPago) || 0);

        const nomeGuia = String(e.guia || '').trim() || 'Guia não informado';
        const formaPagamento = String(e.formaPagamento || '');

        const diaAgencia = relAge[agenciaComissionada].dias[e.data];

        if (!diaAgencia.valorAdulto) {
          diaAgencia.valorAdulto = valorAdultoRegistro(e);
        }

        let dadosGuia = diaAgencia.guias.find(item =>
          chaveAgencia(item.nome) === chaveAgencia(nomeGuia) &&
          item.formaPagamento === formaPagamento
        );

        if (!dadosGuia) {
          dadosGuia = {
            nome: nomeGuia,
            formaPagamento,
            pax: 0,
            adultos: 0,
            criancas: 0,
            cortesias: 0,
            passagens: 0,
            comissao: 0,
            almocaram: 0,
            valorPago: 0
          };

          diaAgencia.guias.push(dadosGuia);
        }

        relAge[agenciaComissionada].pax += pax;
        relAge[agenciaComissionada].adultos += adultos;
        relAge[agenciaComissionada].criancas += criancas;
        relAge[agenciaComissionada].cortesias += cortesias;
        relAge[agenciaComissionada].passagens = somarMoeda(relAge[agenciaComissionada].passagens, passagens);
        relAge[agenciaComissionada].comissao = somarMoeda(relAge[agenciaComissionada].comissao, comissao);
        relAge[agenciaComissionada].almocaram += almocaram;
        relAge[agenciaComissionada].valorPago = somarMoeda(relAge[agenciaComissionada].valorPago, valorPago);

        diaAgencia.pax += pax;
        diaAgencia.adultos += adultos;
        diaAgencia.criancas += criancas;
        diaAgencia.cortesias += cortesias;
        diaAgencia.passagens = somarMoeda(diaAgencia.passagens, passagens);
        diaAgencia.comissao = somarMoeda(diaAgencia.comissao, comissao);
        diaAgencia.almocaram += almocaram;
        diaAgencia.valorPago = somarMoeda(diaAgencia.valorPago, valorPago);

        dadosGuia.pax += pax;
        dadosGuia.adultos += adultos;
        dadosGuia.criancas += criancas;
        dadosGuia.cortesias += cortesias;
        dadosGuia.passagens = somarMoeda(dadosGuia.passagens, passagens);
        dadosGuia.comissao = somarMoeda(dadosGuia.comissao, comissao);
        dadosGuia.almocaram += almocaram;
        dadosGuia.valorPago = somarMoeda(dadosGuia.valorPago, valorPago);
      });
  }

  const divAge = document.getElementById('rel-agencias');

  if (filtroTipoRelatorio === 'embarque') {
    divAge.innerHTML = '<p class="text-gray-500 text-sm italic">Filtro ativo: Só Embarque</p>';
  } else if (Object.keys(relAge).length === 0) {
    divAge.innerHTML = '<p class="text-gray-500 text-sm">Nenhuma comissão da Jardas no período.</p>';
  } else {
    divAge.innerHTML = Object.entries(relAge)
      .sort(([ageA], [ageB]) => ageA.localeCompare(ageB, 'pt-BR'))
      .map(([age, d]) => {
        const diasDaAgencia = Object.entries(d.dias)
          .sort(([dataA], [dataB]) => dataB.localeCompare(dataA));

        const resumoAcertosPeriodo = diasDaAgencia.reduce((total, [data]) => {
          const resumoDia = resumoPagamentosJardas(obterPrestacoesDiarias('agencia', age, data));
          return somarMoeda(total, resumoDia.valorAbatido);
        }, 0);

        const totalAbatidoJardas = resumoAcertosPeriodo;

        const cortesiasConcedidas = diasDaAgencia.reduce((total, [data, dia]) =>
          total + obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto).quantidade,
        0);

        const valorCortesiasConcedidas = diasDaAgencia.reduce((total, [data, dia]) =>
          somarMoeda(total, obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto).valor),
        0);

        const baixasDiariasJardas = calcularBaixasDiariasJardas(dataFim);

        const saldoAnteriorPeriodo = ehDataFechamentoJardas(dataInicio)
          ? 0
          : calcularSaldoJardasAte(deslocarData(dataInicio, -1));

        const saldoAnteriorPorData = {};
        const saldoAposPorData = {};

        diasDaAgencia
          .slice()
          .sort(([dataA], [dataB]) => dataA.localeCompare(dataB))
          .forEach(([data]) => {
            saldoAnteriorPorData[data] = ehDataFechamentoJardas(data)
              ? 0
              : calcularSaldoJardasAte(deslocarData(data, -1));

            saldoAposPorData[data] = calcularSaldoJardasAte(data);
          });

        const saldoLiquido = calcularSaldoJardasAte(dataFim);
        const movimentoPeriodo = arredondar2(saldoLiquido - saldoAnteriorPeriodo);
        const situacaoPeriodo = situacaoSaldoJardas(saldoLiquido);

        const detalhesWhats = diasDaAgencia.map(([data, dia]) => {
          const guiasDoDia = dia.guias
            .sort((guiaA, guiaB) => guiaA.nome.localeCompare(guiaB.nome, 'pt-BR'))
            .map(guia => {
              const criancas = guia.criancas > 0 ? ` ${guia.criancas}chd` : '';
              const pagamento = guia.valorPago > 0
                ? ` pg ${formatarValorCurto(guia.valorPago)} ${nomeFormaPagamentoGuia(guia.formaPagamento).toLocaleLowerCase('pt-BR')}`
                : '';

              return `${guia.nome} ${guia.adultos} pax${criancas}${pagamento}`;
            })
            .join('\n');

          const cortesiasDia = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto);
          const baixaDia = baixasDiariasJardas.porData[data] || { valorDevido: 0, valorAbatido: 0, restante: 0 };
          const fechamentoNoDia = ehDataFechamentoJardas(data);

          const parcelaPagamento = dia.valorPago > 0 ? ` - ${formatarValorCurto(dia.valorPago)} pago` : '';
          const parcelaAbatida = baixaDia.valorAbatido > 0 ? ` - ${formatarValorCurto(baixaDia.valorAbatido)} pagamento abatido` : '';
          const fechamento = fechamentoNoDia ? '\n*Fechamento realizado: contas zeradas*' : '';

          return `*${formatarDataRelatorio(data)}*
${guiasDoDia}
Total de pax = ${dia.adultos}${dia.criancas > 0 ? `+${dia.criancas}chd` : ''}
Cortesias concedidas = ${cortesiasDia.quantidade}
Valor total = ${formatarValorCurto(dia.passagens)}
Almoço = ${formatarValorCurto(dia.comissao)}
Cálculo = ${formatarValorCurto(dia.passagens)}${parcelaPagamento} - ${formatarValorCurto(dia.comissao)} almoço - ${formatarValorCurto(cortesiasDia.valor)} cortesias${parcelaAbatida}${fechamento}
*${fechamentoNoDia ? 'Saldo zerado' : situacaoSaldoJardas(-baixaDia.restante).texto}*`;
        }).join('\n\n');

        const pagamentosPeriodo = d.valorPago > 0 ? `\nPagamentos = ${formatarValorCurto(d.valorPago)}` : '';
        const pagamentosAbatidosPeriodo = totalAbatidoJardas > 0 ? `\nPagamentos abatidos = ${formatarValorCurto(totalAbatidoJardas)}` : '';

        const resumoPeriodo = diasDaAgencia.length > 1
          ? `
*TOTAL DO PERÍODO*
Total de pax = ${d.adultos}${d.criancas > 0 ? `+${d.criancas}chd` : ''}
Total de cortesia = ${d.cortesias}
Valor total = ${formatarValorCurto(d.passagens)}
Almoço = ${formatarValorCurto(d.comissao)}${pagamentosPeriodo}${pagamentosAbatidosPeriodo}
*${situacaoPeriodo.texto}*`
          : `
*SALDO FINAL TOTAL*
*${situacaoPeriodo.texto}*`;

        const textoWhats = `*CONTAS JARDAS*
${formatarDataRelatorio(dataInicio)} a ${formatarDataRelatorio(dataFim)}
${detalhesWhats}${resumoPeriodo}`;

        const linhasDiarias = diasDaAgencia
          .map(([data, dia]) => {
            const cortesiasDia = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto);
            const baixaDia = baixasDiariasJardas.porData[data] || {
              valorDevido: 0,
              creditoDoDia: 0,
              valorAbatido: 0,
              restante: 0,
              quitado: false,
              parcial: false
            };

            const valorParaRepasse = baixaDia.valorDevido;
            const fechamentoNoDia = ehDataFechamentoJardas(data);

            const pagamentosGuias = dia.guias
              .filter(guia => guia.valorPago > 0)
              .sort((guiaA, guiaB) => guiaA.nome.localeCompare(guiaB.nome, 'pt-BR'))
              .map(guia => `${escaparHTML(guia.nome)}: ${escaparHTML(detalharPagamentoGuia(guia.formaPagamento, guia.valorPago))}`)
              .join(' · ');

            const detalhePagamento = pagamentosGuias
              ? `<div class="mt-1 text-blue-700">💳 ${pagamentosGuias}</div>`
              : '';

            return renderizarLinhaPagamentoDiario(
              'agencia',
              age,
              data,
              valorParaRepasse,
              `👨 ${dia.adultos} adultos · ${dia.criancas} crianças${detalhePagamento}${fechamentoNoDia ? '<div class="mt-1 text-green-700 font-bold">⚖️ Fechamento realizado: contas zeradas nesta data</div>' : ''}<div class="mt-1 text-green-700">🎟️ ${cortesiasDia.quantidade} cortesias concedidas · -${formatarMoeda(cortesiasDia.valor)}</div><div class="mt-1 text-purple-700">${baixaDia.creditoDoDia > 0 ? `Crédito do dia ${formatarMoeda(baixaDia.creditoDoDia)}` : `Valor do dia ${formatarMoeda(baixaDia.valorDevido)}`} · Baixado ${formatarMoeda(baixaDia.valorAbatido)} · Restante ${formatarMoeda(baixaDia.restante)}</div>`,
              baixaDia
            );
          })
          .join('');

        const voucherId = `jardas-${dataInicio}-${dataFim}`;

        vouchersJardas[voucherId] = {
          dataInicio,
          dataFim,
          adultos: d.adultos,
          criancas: d.criancas,
          cortesias: d.cortesias,
          cortesiasConcedidas,
          valorCortesiasConcedidas,
          passagens: d.passagens,
          comissao: d.comissao,
          valorPago: d.valorPago,
          valorAbatido: totalAbatidoJardas,
          saldoAnterior: saldoAnteriorPeriodo,
          saldo: saldoLiquido,
          dias: diasDaAgencia.map(([data, dia]) => {
            const cortesiasDia = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto);
            const baixaDia = baixasDiariasJardas.porData[data] || {
              valorDevido: 0,
              creditoDoDia: 0,
              valorAbatido: 0,
              restante: 0
            };

            return {
              data,
              adultos: dia.adultos,
              criancas: dia.criancas,
              cortesias: dia.cortesias,
              cortesiasConcedidas: cortesiasDia.quantidade,
              valorCortesiasConcedidas: cortesiasDia.valor,
              passagens: dia.passagens,
              comissao: dia.comissao,
              valorPago: dia.valorPago,
              valorDevido: baixaDia.valorDevido,
              creditoDoDia: baixaDia.creditoDoDia,
              valorAbatido: baixaDia.valorAbatido,
              restante: baixaDia.restante,
              saldoAnterior: saldoAnteriorPorData[data],
              saldo: ehDataFechamentoJardas(data) ? 0 : -baixaDia.restante,
              fechamentoNoDia: ehDataFechamentoJardas(data),
              guias: dia.guias
                .slice()
                .sort((guiaA, guiaB) => guiaA.nome.localeCompare(guiaB.nome, 'pt-BR'))
            };
          })
        };

        const ultimoFechamento = dataUltimoFechamentoJardas();

        return `
          <div class="border-2 border-purple-200 rounded-xl p-3 mb-4">
            <div class="mb-2">
              <div class="font-bold text-purple-800">${escaparHTML(age)}</div>
              <div class="text-xs text-gray-500">👨 ${d.adultos} adultos · ${d.criancas} crianças</div>

              <div class="bg-gray-50 border border-gray-200 rounded-lg p-2 mt-2 text-sm flex justify-between gap-2">
                <span>Saldo acumulado até ${formatarDataRelatorio(deslocarData(dataInicio, -1))}</span>
                <strong>${situacaoSaldoJardas(saldoAnteriorPeriodo).texto}</strong>
              </div>

              <div class="bg-blue-50 border border-blue-200 rounded-lg p-2 mt-2 text-sm flex justify-between gap-2">
                <span>${dataInicio === dataFim ? `Movimento de ${formatarDataRelatorio(dataInicio)}` : 'Movimento do período'}</span>
                <strong>${situacaoSaldoJardas(movimentoPeriodo).texto}</strong>
              </div>

                <div class="bg-blue-50 rounded-lg p-2 text-right">
                  <div class="text-xs text-gray-500">Comissão Jardas</div>

                 <button type="button" onclick="zerarContasJardasAte('${dataFim}')" class="block w-full bg-gray-700 text-white text-sm font-bold py-3 rounded-lg text-center mb-3">⚖️ Fechar e zerar contas até ${formatarDataRelatorio(dataFim)}</button>`

  }

  // Conferência

  contasGuias.forEach(e => {

  contasGuias.forEach(e => {

  )].sort((a, b) => a.localeCompare(b, 'pt-BR'));

  document.getElementById('barcos-list').innerHTML = barcos.map(b => `<option value="${escaparHTML(b)}">`).join('');

  atualizarOpcoesRelatorioBarco();

  atualizarJacilene();
  atualizarHistorico();
}

function formatarDataHistorico(data) {
  return dataValidaISO(data)
    ? formatarDataRelatorio(data)
    : (data || '--');
}

function descricaoMovimentoPrestacao(prestacao) {
  if (prestacao.dataMovimento) {
    return `Movimento: ${formatarDataHistorico(prestacao.dataMovimento)}`;
  }

  if (prestacao.periodoInicio === prestacao.periodoFim) {
    return `Movimento: ${formatarDataHistorico(prestacao.periodoInicio)}`;
  }

  return `Período antigo: ${formatarDataHistorico(prestacao.periodoInicio)} a ${formatarDataHistorico(prestacao.periodoFim)}`;
}

function momentoPrestacao(prestacao) {
  return `${prestacao.dataPrestacao || ''} ${prestacao.horaPrestacao || ''}`;
}

function detalheParcelaPrestacao(prestacao) {
  if (prestacao.tipo === 'agencia') {
    if (prestacao.fechamentoGeral) {
      const saldoAnterior = situacaoSaldoJardas(Number(prestacao.saldoAntesFechamento) || 0).texto;
      return `<div class="text-xs text-gray-700 font-semibold">⚖️ Fechamento geral · antes: ${escaparHTML(saldoAnterior)}</div>`;
    }

    return `<div class="text-xs text-purple-700 font-semibold">💰 ${escaparHTML(descricaoPagamentoJardas(prestacao))} · pagamento ${prestacao.pagamentoParcial ? 'parcial' : 'registrado'}</div>`;
  }

  const valorTotal = arredondar2(Number(prestacao.valorTotalMovimento) || 0);

  if (prestacao.tipo !== 'catamara' || valorTotal <= 0) return '';

  const parcial = prestacao.pagamentoParcial === true || prestacao.statusPagamento === 'parcial';

  return `<div class="text-xs ${parcial ? 'text-yellow-700' : 'text-green-700'} font-semibold">
    ${parcial ? '🟡 Pagamento parcial' : '✅ Quitação'} · Total da data ${formatarMoeda(valorTotal)}
  </div>`;
}

// Atualizar Histórico de Pagamentos
function atualizarHistorico() {
  // Último pagamento por catamarã
  const ultimasCatamaras = {};

  prestacoes.filter(p => p.tipo === 'catamara').forEach(p => {
    const nome = nomeCanonicoEmbarcacao(p.nome);

    if (!ultimasCatamaras[nome] || momentoPrestacao(p) > momentoPrestacao(ultimasCatamaras[nome])) {
      ultimasCatamaras[nome] = p;
    }
  });

  const divCatamaras = document.getElementById('historico-catamaras');

  if (Object.keys(ultimasCatamaras).length === 0) {
    divCatamaras.innerHTML = '<p class="text-gray-500 text-sm">Nenhum pagamento registrado.</p>';
  } else {
    divCatamaras.innerHTML = Object.entries(ultimasCatamaras).map(([nome, p]) => `
      <div class="bg-green-50 p-3 rounded border-l-4 border-green-500">
        <div class="flex justify-between font-bold">
          <span>${escaparHTML(nome)}</span>
          <span class="text-green-700">${formatarMoeda(p.valor)}</span>
        </div>
        <div class="text-xs text-gray-600">${descricaoMovimentoPrestacao(p)}</div>
        ${detalheParcelaPrestacao(p)}
        <div class="text-xs text-gray-500">Pago em ${formatarDataHistorico(p.dataPrestacao)} ${escaparHTML(p.horaPrestacao || '')}</div>
        ${p.observacao ? `<div class="text-xs text-gray-700 mt-1">💬 ${escaparHTML(p.observacao)}</div>` : ''}
        ${detalheSaldoPrestacao(p)}
      </div>
    `).join('');
  }

  // Último pagamento por agência
  const ultimasAgencias = {};

  prestacoes
    .filter(p => p.tipo === 'agencia' && ehAgenciaComissionada(p.nome))
    .forEach(p => {
      const nome = 'Jardas';

      if (!ultimasAgencias[nome] || momentoPrestacao(p) > momentoPrestacao(ultimasAgencias[nome])) {
        ultimasAgencias[nome] = p;
      }
    });

  const divAgencias = document.getElementById('historico-agencias');

  if (Object.keys(ultimasAgencias).length === 0) {
    divAgencias.innerHTML = '<p class="text-gray-500 text-sm">Nenhum pagamento de comissão da Jardas registrado.</p>';
  } else {
    divAgencias.innerHTML = Object.entries(ultimasAgencias).map(([nome, p]) => `
      <div class="bg-purple-50 p-3 rounded border-l-4 border-purple-500">
        <div class="flex justify-between font-bold">
          <span>${escaparHTML(nome)}</span>
          <span class="text-purple-700">${formatarMoeda(p.valor)}</span>
        </div>
        <div class="text-xs text-gray-600">${descricaoMovimentoPrestacao(p)}</div>
        <div class="text-xs text-gray-500">Pago em ${formatarDataHistorico(p.dataPrestacao)} ${escaparHTML(p.horaPrestacao || '')}</div>
        ${p.observacao ? `<div class="text-xs text-gray-700 mt-1">💬 ${escaparHTML(p.observacao)}</div>` : ''}
        ${detalheSaldoPrestacao(p)}
      </div>
    `).join('');
  }

  // Todos os pagamentos
  const todasPrestacoes = ordenarPorDataHora(prestacoes.map(p => ({
    ...p,
    data: p.dataPrestacao || '',
    hora: p.horaPrestacao || ''
  })));

  const divTodas = document.getElementById('lista-prestacoes');

  if (todasPrestacoes.length === 0) {
    divTodas.innerHTML = '<p class="text-gray-500 text-sm">Nenhum pagamento registrado.</p>';
  } else {
    divTodas.innerHTML = todasPrestacoes.slice().reverse().map(p => `
      <div class="bg-gray-50 p-3 rounded text-sm border-l-4 ${p.tipo === 'catamara' ? 'border-green-500' : 'border-purple-500'}">
        <div class="flex justify-between font-bold">
          <span>${p.tipo === 'catamara' ? '🚤' : ''} ${escaparHTML(p.tipo === 'catamara' ? nomeCanonicoEmbarcacao(p.nome) : p.nome)}</span>
          <span class="text-gray-500 text-xs">${formatarDataHistorico(p.dataPrestacao)} ${escaparHTML(p.horaPrestacao || '')}</span>
        </div>
        <div class="text-xs text-gray-600 mb-1">${descricaoMovimentoPrestacao(p)}</div>
        ${detalheParcelaPrestacao(p)}
        <div class="text-xs font-bold ${p.tipo === 'catamara' ? 'text-green-700' : 'text-purple-700'}">
          ${formatarMoeda(p.valor)}
        </div>
        ${p.observacao ? `<div class="text-xs text-gray-700 mt-1">💬 ${escaparHTML(p.observacao)}</div>` : ''}
        ${detalheSaldoPrestacao(p)}
      </div>
    `).join('');
  }

  const divExclusoes = document.getElementById('historico-exclusoes');

  if (divExclusoes) {
    const exclusoesOrdenadas = historicoExclusoes.slice().sort((a, b) =>
      `${b.dataExclusao || ''} ${b.horaExclusao || ''}`.localeCompare(`${a.dataExclusao || ''} ${a.horaExclusao || ''}`)
    );

    divExclusoes.innerHTML = exclusoesOrdenadas.length === 0
      ? '<p class="text-gray-500 text-sm">Nenhum registro excluído.</p>'
      : exclusoesOrdenadas.map(item => {
          const dados = item.dados || {};
          const nome = item.tipo === 'guia' ? dados.guia : nomeCanonicoEmbarcacao(dados.catamaran);
          const movimento = dados.data ? formatarDataHistorico(dados.data) : '--';

          const resumo = item.tipo === 'guia'
            ? `${Number(dados.adultos) || 0} adultos · ${Number(dados.criancas) || 0} crianças · ${formatarMoeda(valorFaturamentoRegistro(dados))}`
            : `${Number(dados.totalPax) || 0} passageiros · ${formatarMoeda(Number(dados.valorRepasse) || 0)}`;

          return `<div class="bg-red-50 border-l-4 border-red-400 rounded p-3 text-sm">
            <div class="font-bold">${item.tipo === 'guia' ? 'Guia' : 'Embarcação'}: ${escaparHTML(nome || 'Não informado')}</div>
            <div class="text-xs text-gray-700">Movimento de ${movimento} · ${resumo}</div>
            <div class="text-xs text-gray-500 mt-1">Excluído em ${formatarDataHistorico(item.dataExclusao)} ${escaparHTML(item.horaExclusao || '')} por ${escaparHTML(item.usuario || 'usuário autenticado')}</div>
          </div>`;
        }).join('');
  }
}

  document.getElementById('cfg-comissao').value = config.comissao;

  document.getElementById('cfg-inicio-cortesias-jardas').value = config.inicioCortesiasJardas;
  document.getElementById('cfg-fechamento-inicial-jardas').value = config.fechamentoInicialJardas;

  document.getElementById('lbl-adulto').innerText = `R$${formatarValorCurto(config.adulto)}`;
  document.getElementById('lbl-crianca').innerText = `R$${formatarValorCurto(config.crianca)}`;
  document.getElementById('lbl-comissao-rel').innerText = formatarValorCurto(config.comissao);

function salvarConfig() {
  const novosValores = {
    adulto: arredondar2(Number(document.getElementById('cfg-adulto').value)),
    crianca: arredondar2(Number(document.getElementById('cfg-crianca').value)),
    comissao: arredondar2(Number(document.getElementById('cfg-comissao').value)),
    inicioCortesiasJardas: document.getElementById('cfg-inicio-cortesias-jardas').value,
    fechamentoInicialJardas: document.getElementById('cfg-fechamento-inicial-jardas').value
  };

  if ([novosValores.adulto, novosValores.crianca, novosValores.comissao].some(valor => !Number.isFinite(valor) || valor < 0)) {
    return alert('Informe somente valores iguais ou maiores que zero.');
  }

  const configSalva = normalizarConfig(novosValores);

  db.collection('config').doc('principal').set(configSalva)
    .then(() => {
      config = configSalva;
      carregarConfig();
      alert('Configurações salvas!');
    })
    .catch((error) => alert('Erro: ' + error.message));
}

function exportarRelatorioPeriodo() {

  if (exportarGuias) {
    const guiasParaExportar = filtroTipoRelatorio === 'comissao'

      guiasParaExportar.forEach(e => {

      });

  }

  if (exportarBarcos && dadosBarcos.length > 0) {

    csv += 'Data;Hora;Catamarã;Adultos;Crianças;Bebês;Cortesia;Total;Valor Repasse\n';

  const BOM = '\uFEFF';

  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `relatorio_${dataInicio}_a_${dataFim}_${filtroTipoRelatorio}.csv`;
  link.click();
}

function restaurarBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);

      if (!validarEstruturaBackup(data)) {
        alert('Arquivo de backup inválido!');
        return;
      }

      const modo = prompt(`Este backup contém:
• ${data.registrosGuias.length} guias
• ${data.registrosEmbarcacoes.length} embarcações
• ${(data.prestacoes || []).length} prestações
• ${(data.historicoExclusoes || []).length} exclusões preservadas

Digite MESCLAR para acrescentar sem duplicar ou SUBSTITUIR para deixar o banco igual ao backup.
Para cancelar, deixe em branco.`);

      const escolha = String(modo || '').trim().toLocaleUpperCase('pt-BR');

      if (escolha === 'MESCLAR') mesclarBackup(data);
      else if (escolha === 'SUBSTITUIR') substituirBackup(data);
      else if (escolha) alert('Opção não reconhecida. Nenhum dado foi alterado.');
    } catch (err) {
      alert('Erro ao ler o arquivo: ' + err.message);
    }
  };

  reader.readAsText(file);
  event.target.value = '';
}

function validarEstruturaBackup(data) {
  const objeto = item => item && typeof item === 'object' && !Array.isArray(item);

  const numeroValido = valor => valor === undefined || (Number.isFinite(Number(valor)) && Number(valor) >= 0);

  const guiaValido = item => objeto(item) && dataValidaISO(item.data) &&
    typeof item.guia === 'string' && typeof item.agencia === 'string' &&
    ['adultos', 'criancas', 'bebes', 'cortesia', 'totalPax', 'faturamento', 'valorPago', 'almocaram'].every(chave => numeroValido(item[chave]));

  const barcoValido = item => objeto(item) && dataValidaISO(item.data) && typeof item.catamaran === 'string' &&
    ['adultos', 'criancas', 'bebes', 'cortesia', 'totalPax', 'valorRepasse'].every(chave => numeroValido(item[chave]));

  const prestacaoValida = item => objeto(item) && typeof item.tipo === 'string' && typeof item.nome === 'string' &&
    numeroValido(item.valor) && (!item.dataMovimento || dataValidaISO(item.dataMovimento));

  const configValida = !data.config || (
    objeto(data.config) &&
    ['adulto', 'crianca', 'comissao'].every(chave => Number.isFinite(Number(data.config[chave])) && Number(data.config[chave]) >= 0) &&
    (!data.config.inicioCortesiasJardas || dataValidaISO(data.config.inicioCortesiasJardas)) &&
    (!data.config.fechamentoInicialJardas || dataValidaISO(data.config.fechamentoInicialJardas))
  );

  return Boolean(
    objeto(data) &&
    Array.isArray(data.registrosGuias) && data.registrosGuias.every(guiaValido) &&
    Array.isArray(data.registrosEmbarcacoes) && data.registrosEmbarcacoes.every(barcoValido) &&
    (!data.prestacoes || (Array.isArray(data.prestacoes) && data.prestacoes.every(prestacaoValida))) &&
    (!data.historicoExclusoes || (Array.isArray(data.historicoExclusoes) && data.historicoExclusoes.every(objeto))) &&
    configValida
  );
}

function hashBackup(texto) {
  let hash = 2166136261;

  for (let i = 0; i < texto.length; i++) {
    hash ^= texto.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }

  return (hash >>> 0).toString(36);
}

function prepararItensBackup(itens, prefixo) {
  return (itens || []).map((item, indice) => {
    const { id, timestamp, atualizadoEm, ...dados } = item;

    const idEstavel = id || `importado-${prefixo}-${hashBackup(JSON.stringify(dados))}-${indice}`;

    return {
      id: idEstavel,
      dados: {
        ...dados,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }
    };
  });
}

async function gravarEmLotes(nomeColecao, itens, mesclar = true) {
  for (let inicio = 0; inicio < itens.length; inicio += 400) {
    const batch = db.batch();

    itens.slice(inicio, inicio + 400).forEach(item =>
      batch.set(db.collection(nomeColecao).doc(item.id), item.dados, { merge: mesclar })
    );

    await batch.commit();
  }
}

async function excluirEmLotes(nomeColecao, ids) {
  for (let inicio = 0; inicio < ids.length; inicio += 400) {
    const batch = db.batch();

    ids.slice(inicio, inicio + 400).forEach(id => batch.delete(db.collection(nomeColecao).doc(id)));

    await batch.commit();
  }
}

function colecoesDoBackup(data) {
  return [
    { nome: 'registrosGuias', atuais: registrosGuias, itens: prepararItensBackup(data.registrosGuias, 'guia') },
    { nome: 'registrosEmbarcacoes', atuais: registrosEmbarcacoes, itens: prepararItensBackup(data.registrosEmbarcacoes, 'barco') },
    { nome: 'prestacoes', atuais: prestacoes, itens: prepararItensBackup(data.prestacoes || [], 'prestacao') },
    { nome: 'historicoExclusoes', atuais: historicoExclusoes, itens: prepararItensBackup(data.historicoExclusoes || [], 'exclusao') }
  ];
}

async function substituirBackup(data) {
  if (!confirm('Os dados do backup serão enviados primeiro. Somente depois disso os registros que não pertencem ao backup serão removidos. Continuar?')) return;

  try {
    const colecoes = colecoesDoBackup(data);

    for (const colecao of colecoes) await gravarEmLotes(colecao.nome, colecao.itens, false);

    if (data.config) {
      await db.collection('config').doc('principal').set(normalizarConfig(data.config));
    }

    for (const colecao of colecoes) {
      const idsBackup = new Set(colecao.itens.map(item => item.id));
      const idsRemover = colecao.atuais.map(item => item.id).filter(id => !idsBackup.has(id));
      await excluirEmLotes(colecao.nome, idsRemover);
    }

    alert('✅ Backup restaurado com segurança!');
  } catch (erro) {
    alert('A restauração não foi concluída. Os dados antigos não foram apagados antes do envio. Erro: ' + erro.message);
  }
}

async function mesclarBackup(data) {
  try {
    for (const colecao of colecoesDoBackup(data)) {
      await gravarEmLotes(colecao.nome, colecao.itens);
    }

    if (data.config) {
      await db.collection('config').doc('principal').set(normalizarConfig(data.config), { merge: true });
    }

    alert('✅ Backup mesclado sem duplicar os mesmos registros!');
  } catch (erro) {
    alert('A mesclagem não foi concluída: ' + erro.message);
  }
}

function abrirTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));

  document.getElementById('tab-' + tab).classList.remove('hidden');
  document.getElementById('btn-' + tab).classList.add('tab-active');

  if (tab === 'jacilene') atualizarJacilene();
}

function mensagemErroLogin(erro) {
  const mensagens = {
    'auth/invalid-credential': 'Login ou senha incorretos.',
    'auth/user-not-found': 'Login ou senha incorretos.',
    'auth/wrong-password': 'Login ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
    'auth/network-request-failed': 'Sem conexão. Verifique a internet e tente novamente.'
  };

  return mensagens[erro?.code] || 'Não foi possível entrar. Confira o login e a senha.';
}

function entrarNoApp(event) {
  event.preventDefault();

  const email = document.getElementById('auth-email').value.trim();
  const senha = document.getElementById('auth-senha').value;

  const erroElemento = document.getElementById('auth-erro');
  const botao = document.getElementById('auth-entrar');

  erroElemento.classList.add('hidden');

  botao.disabled = true;
  botao.innerText = 'Entrando...';

  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .then(() => firebase.auth().signInWithEmailAndPassword(email, senha))
    .catch(erro => {
      erroElemento.innerText = mensagemErroLogin(erro);
      erroElemento.classList.remove('hidden');
    })
    .finally(() => {
      botao.disabled = false;
      botao.innerText = 'Entrar';
    });
}

function sairDoApp() {
  if (!confirm('Sair do Controle Catamarã neste aparelho?')) return;
  firebase.auth().signOut();
}

function enviarLinkSenha() {
  const email = document.getElementById('auth-email').value.trim();
  const mensagem = document.getElementById('auth-erro');

  if (!email) {
    mensagem.className = 'text-sm text-red-600 font-semibold mb-3';
    mensagem.innerText = 'Informe o e-mail do login para receber o link.';
    return;
  }

  firebase.auth().sendPasswordResetEmail(email)
    .then(() => {
      mensagem.className = 'text-sm text-green-700 font-semibold mb-3';
      mensagem.innerText = 'Link enviado. Confira também a caixa de spam do e-mail.';
    })
    .catch(erro => {
      mensagem.className = 'text-sm text-red-600 font-semibold mb-3';
      mensagem.innerText = mensagemErroLogin(erro);
    });
}

firebase.auth().onAuthStateChanged(async usuario => {
  usuarioAtual = usuario || null;

  const telaLogin = document.getElementById('auth-screen');

  if (usuario) {
    try {
      const acesso = await db.collection('usuariosAutorizados').doc(usuario.uid).get();

      if (!acesso.exists) throw new Error('Conta sem autorização para este aplicativo.');

      document.body.classList.remove('auth-pendente');
      telaLogin.classList.add('hidden');

      carregarDados();
    } catch (erro) {
      const erroElemento = document.getElementById('auth-erro');
      erroElemento.innerText = erro.message || 'Esta conta não está autorizada.';
      erroElemento.classList.remove('hidden');

      await firebase.auth().signOut();
    }
  } else {
    encerrarCarregamentoDados();

    registrosGuias = [];
    registrosEmbarcacoes = [];
    prestacoes = [];
    historicoExclusoes = [];

    document.body.classList.add('auth-pendente');
    telaLogin.classList.remove('hidden');

    document.getElementById('auth-senha').value = '';
  }
});
</script>
