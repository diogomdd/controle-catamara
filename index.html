// FUNÇÕES AUXILIARES
function arredondar2(valor) {
  const numero = Number(valor);
  if (!Number.isFinite(numero)) return 0;
  return Math.round((numero + Number.EPSILON) * 100) / 100;
}

function somarMoeda(...valores) {
  return valores.reduce((total, valor) => arredondar2(total + (Number(valor) || 0)), 0);
}

function dataValidaISO(data) {
  return /^\d{4}-\d{2}-\d{2}$/.test(String(data || ''));
}

function dataLocalHoje() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = String(hoje.getMonth() + 1).padStart(2, '0');
  const dia = String(hoje.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function primeiroDiaMesAtual() {
  return `${dataLocalHoje().slice(0, 8)}01`;
}

function obterNumero(id) {
  const valor = parseInt(document.getElementById(id).value, 10);
  if (isNaN(valor) || valor < 0) return 0;
  return valor;
}

function obterValorMonetario(id) {
  const valor = parseFloat(String(document.getElementById(id).value).replace(',', '.'));
  if (isNaN(valor) || valor < 0) return 0;
  return arredondar2(valor);
}

function escaparHTML(texto) {
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatarMoeda(valor) {
  const numero = Number(valor);
  const seguro = Number.isFinite(numero) ? numero : 0;
  return `R$ ${seguro.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function formatarValorCurto(valor) {
  const numero = Number(valor);
  const seguro = Number.isFinite(numero) ? numero : 0;
  return seguro.toLocaleString('pt-BR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

function escapeCSV(valor) {
  let conteudo = String(valor ?? '');
  if (/^[=+\-@]/.test(conteudo)) conteudo = `'${conteudo}`;
  const str = conteudo.replace(/"/g, '""');
  return `"${str}"`;
}

function normalizarConfig(dados) {
  const origem = dados && typeof dados === 'object' ? dados : {};

  const dataOk = valor => (dataValidaISO(valor) ? valor : null);

  return {
    adulto: arredondar2(Number(origem.adulto ?? 60)),
    crianca: arredondar2(Number(origem.crianca ?? 35)),
    comissao: arredondar2(Number(origem.comissao ?? 5)),
    inicioCortesiasJardas: dataOk(origem.inicioCortesiasJardas) || REGRA_JARDAS_PADRAO.inicioCortesias,
    fechamentoInicialJardas: dataOk(origem.fechamentoInicialJardas) || REGRA_JARDAS_PADRAO.fechamentoInicial
  };
}

function chaveAgencia(nome) {
  return String(nome || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase('pt-BR')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function ehAgenciaComissionada(nome) {
  return chaveAgencia(nome) === 'jardas';
}

function distanciaTexto(a, b) {
  const origem = String(a || '');
  const destino = String(b || '');
  const linha = Array.from({ length: destino.length + 1 }, (_, indice) => indice);

  for (let i = 1; i <= origem.length; i++) {
    let anterior = linha[0];
    linha[0] = i;

    for (let j = 1; j <= destino.length; j++) {
      const atual = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j - 1] + 1, anterior + (origem[i - 1] === destino[j - 1] ? 0 : 1));
      anterior = atual;
    }
  }

  return linha[destino.length];
}

function pareceAgenciaJardas(nome) {
  const chave = chaveAgencia(nome);
  return chave !== 'jardas' && (chave.includes('jard') || distanciaTexto(chave, 'jardas') <= 2);
}

function nomeFormaPagamentoGuia(valor) {
  const formas = {
    'nao-pagou': 'Não pagou',
    'dinheiro': 'Dinheiro',
    'cartao': 'Cartão',
    'pix': 'PIX',
    'dinheiro-cartao': 'Dinheiro + cartão'
  };
  return formas[String(valor || '')] || 'Não informado';
}

function detalharPagamentoGuia(formaPagamento, valor) {
  const nomeForma = nomeFormaPagamentoGuia(formaPagamento);
  return ['Dinheiro', 'Cartão', 'PIX', 'Dinheiro + cartão'].includes(nomeForma)
    ? `${nomeForma} · ${formatarMoeda(Number(valor) || 0)}`
    : nomeForma;
}

function situacaoSaldoJardas(saldo) {
  const valor = arredondar2(saldo);

  if (valor > 0.009) {
    return {
      rotulo: 'Devemos ao Jardas',
      texto: `Devemos ao Jardas: ${formatarMoeda(valor)}`
    };
  }

  if (valor < -0.009) {
    return {
      rotulo: 'Jardas deve',
      texto: `Jardas deve: ${formatarMoeda(Math.abs(valor))}`
    };
  }

  return {
    rotulo: 'Saldo',
    texto: 'Saldo zerado'
  };
}

function calcularCortesiasJardas(adultos) {
  const quantidade = Math.max(0, Math.floor(Number(adultos) || 0));

  // Menos de 15 adultos não gera cortesia
  if (quantidade < 15) return 0;

  // A cada 20 adultos: 2 cortesias
  const gruposDeVinte = Math.floor(quantidade / 20);

  // Se sobrar 15 ou mais adultos: +1 cortesia
  const restante = quantidade % 20;

  return (gruposDeVinte * 2) + (restante >= 15 ? 1 : 0);
}

function obterCortesiasDiariasJardas(data, adultos, valorAdulto = 60) {
  if (!dataValidaISO(data) || data < config.inicioCortesiasJardas) {
    return { quantidade: 0, valor: 0 };
  }

  const quantidade = calcularCortesiasJardas(adultos);
  const valorUnitario = arredondar2(Number(valorAdulto) || config.adulto || 60);

  return {
    quantidade,
    valor: arredondar2(quantidade * valorUnitario)
  };
}

function deslocarData(data, quantidadeDias) {
  if (!dataValidaISO(data)) return dataLocalHoje();

  const [ano, mes, dia] = String(data).split('-').map(Number);
  const resultado = new Date(Date.UTC(ano, mes - 1, dia));
  resultado.setUTCDate(resultado.getUTCDate() + quantidadeDias);
  return resultado.toISOString().slice(0, 10);
}

function saldoAssinadoPrestacao(prestacao) {
  const valor = arredondar2(Math.max(0, Number(prestacao?.saldoDeclaradoValor) || 0));

  if (prestacao?.saldoDeclaradoTipo === 'jardas-deve') return arredondar2(-valor);
  if (prestacao?.saldoDeclaradoTipo === 'nos-devemos') return valor;

  return 0;
}

function valorAssinadoPagamentoJardas(prestacao) {
  const valor = arredondar2(Math.max(0, Number(prestacao?.valor) || 0));

  if (prestacao?.fechamentoGeral || valor <= 0) return 0;

  const efeitoSalvo = Number(prestacao?.efeitoSaldo);
  if (Number.isFinite(efeitoSalvo)) return arredondar2(efeitoSalvo);

  return valor;
}

function aplicarPagamentoAoSaldo(saldoAntes, valorPagamento) {
  const saldo = arredondar2(saldoAntes);
  const valor = arredondar2(valorPagamento);

  if (saldo < -0.009) return somarMoeda(saldo, valor);
  if (saldo > 0.009) return arredondar2(saldo - valor);

  return 0;
}

function resumoPagamentosJardas(pagamentos) {
  return pagamentos.reduce((resumo, pagamento) => {
    if (pagamento?.fechamentoGeral) return resumo;

    const efeito = valorAssinadoPagamentoJardas(pagamento);

    resumo.valorAbatido = somarMoeda(resumo.valorAbatido, Math.max(0, efeito));
    resumo.saldoAssinado = somarMoeda(resumo.saldoAssinado, efeito);

    return resumo;
  }, { valorAbatido: 0, saldoAssinado: 0 });
}

function dataUltimoFechamentoJardas() {
  const fechamentoInicial = dataValidaISO(config.fechamentoInicialJardas)
    ? config.fechamentoInicialJardas
    : '';

  return prestacoes
    .filter(p =>
      p.tipo === 'agencia' &&
      ehAgenciaComissionada(p.nome) &&
      p.fechamentoGeral &&
      dataValidaISO(p.dataMovimento)
    )
    .reduce(
      (dataMaisRecente, p) => (p.dataMovimento > dataMaisRecente ? p.dataMovimento : dataMaisRecente),
      fechamentoInicial
    );
}

function ehDataFechamentoJardas(data) {
  const fechamentoInicial = dataValidaISO(config.fechamentoInicialJardas)
    ? config.fechamentoInicialJardas
    : '';

  return (fechamentoInicial && data === fechamentoInicial) || prestacoes.some(p =>
    p.tipo === 'agencia' &&
    ehAgenciaComissionada(p.nome) &&
    p.fechamentoGeral &&
    p.dataMovimento === data
  );
}

function calcularBaixasDiariasJardas(dataFim) {
  if (!dataValidaISO(dataFim)) {
    return { porData: {}, totalPagamentos: 0, creditoOperacional: 0, creditoSobrando: 0 };
  }

  const inicioCortesias = config.inicioCortesiasJardas;
  const fechamentoInicial = dataValidaISO(config.fechamentoInicialJardas)
    ? config.fechamentoInicialJardas
    : '';

  const fechamentoAteData = prestacoes
    .filter(p =>
      p.tipo === 'agencia' &&
      ehAgenciaComissionada(p.nome) &&
      p.fechamentoGeral &&
      dataValidaISO(p.dataMovimento) &&
      p.dataMovimento <= dataFim
    )
    .reduce(
      (dataMaisRecente, p) => (p.dataMovimento > dataMaisRecente ? p.dataMovimento : dataMaisRecente),
      (fechamentoInicial && dataFim >= fechamentoInicial ? fechamentoInicial : '')
    );

  const dataInicio = fechamentoAteData ? deslocarData(fechamentoAteData, 1) : inicioCortesias;

  if (!dataValidaISO(dataInicio) || dataInicio > dataFim) {
    return { porData: {}, totalPagamentos: 0, creditoOperacional: 0, creditoSobrando: 0 };
  }

  const dias = {};

  registrosGuias
    .filter(registro =>
      ehAgenciaComissionada(registro.agencia) &&
      dataValidaISO(registro.data) &&
      registro.data >= dataInicio &&
      registro.data <= dataFim
    )
    .forEach(registro => {
      if (!dias[registro.data]) {
        dias[registro.data] = {
          adultos: 0,
          criancas: 0,
          valorPagoGuias: 0,
          passagens: 0,
          comissao: 0,
          valorAdulto: 0
        };
      }

      dias[registro.data].adultos += Number(registro.adultos) || 0;
      dias[registro.data].criancas += Number(registro.criancas) || 0;
      dias[registro.data].valorPagoGuias = somarMoeda(dias[registro.data].valorPagoGuias, registro.valorPago);
      dias[registro.data].passagens = somarMoeda(dias[registro.data].passagens, valorFaturamentoRegistro(registro));
      dias[registro.data].comissao = somarMoeda(dias[registro.data].comissao, valorComissaoRegistro(registro));

      if (!dias[registro.data].valorAdulto) {
        dias[registro.data].valorAdulto = valorAdultoRegistro(registro);
      }
    });

  const creditoOperacional = arredondar2(Object.entries(dias).reduce((total, [data, dia]) => {
    const cortesias = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto).valor;
    const creditoDia = somarMoeda(dia.valorPagoGuias, dia.comissao, cortesias) - dia.passagens;
    return somarMoeda(total, Math.max(0, creditoDia));
  }, 0));

  const pagamentosRecebidos = prestacoes
    .filter(p =>
      p.tipo === 'agencia' &&
      ehAgenciaComissionada(p.nome) &&
      !p.fechamentoGeral &&
      dataValidaISO(p.dataMovimento) &&
      p.dataMovimento >= dataInicio &&
      p.dataMovimento <= dataFim
    )
    .reduce((total, p) => somarMoeda(total, Math.max(0, valorAssinadoPagamentoJardas(p))), 0);

  let creditoDisponivel = somarMoeda(creditoOperacional, pagamentosRecebidos);
  const totalPagamentos = pagamentosRecebidos;
  const porData = {};

  Object.entries(dias)
    .sort(([dataA], [dataB]) => dataA.localeCompare(dataB))
    .forEach(([data, dia]) => {
      const passagens = arredondar2(dia.passagens);
      const comissao = arredondar2(dia.comissao);
      const cortesias = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto).valor;

      const creditoDoDia = arredondar2(Math.max(0, somarMoeda(dia.valorPagoGuias, comissao, cortesias) - passagens));
      const valorDevido = arredondar2(Math.max(0, passagens - somarMoeda(dia.valorPagoGuias, comissao, cortesias)));

      const valorAbatido = arredondar2(Math.min(valorDevido, creditoDisponivel));
      const restante = arredondar2(Math.max(0, valorDevido - valorAbatido));

      creditoDisponivel = arredondar2(Math.max(0, creditoDisponivel - valorAbatido));

      porData[data] = {
        valorDevido,
        creditoDoDia,
        valorAbatido,
        restante,
        quitado: valorDevido > 0 && restante < 0.01,
        parcial: valorAbatido > 0 && restante >= 0.01
      };
    });

  return {
    porData,
    totalPagamentos,
    creditoOperacional,
    creditoSobrando: creditoDisponivel
  };
}

function calcularSaldoJardasAte(dataFim, prestacaoIgnoradaId = null) {
  if (!dataValidaISO(dataFim) || dataFim < config.inicioCortesiasJardas) return 0;

  if (!prestacaoIgnoradaId && cacheSaldoJardas.has(dataFim)) {
    return cacheSaldoJardas.get(dataFim);
  }

  const prestacoesJardas = prestacoes
    .filter(p =>
      p.id !== prestacaoIgnoradaId &&
      p.tipo === 'agencia' &&
      ehAgenciaComissionada(p.nome) &&
      dataValidaISO(p.dataMovimento) &&
      p.dataMovimento <= dataFim
    );

  const fechamentoRegistrado = prestacoesJardas
    .filter(p => p.fechamentoGeral)
    .sort((a, b) => `${b.dataMovimento} ${momentoPrestacao(b)}`.localeCompare(`${a.dataMovimento} ${momentoPrestacao(a)}`))[0];

  const fechamentoInicial = dataValidaISO(config.fechamentoInicialJardas)
    ? config.fechamentoInicialJardas
    : '';

  const fechamentoConhecido = fechamentoInicial && dataFim >= fechamentoInicial
    ? {
        dataMovimento: fechamentoInicial,
        saldoDeclaradoTipo: 'zerado',
        saldoDeclaradoValor: 0,
        fechamentoGeral: true
      }
    : null;

  const ultimoFechamento = fechamentoRegistrado && (!fechamentoConhecido || fechamentoRegistrado.dataMovimento > fechamentoConhecido.dataMovimento)
    ? fechamentoRegistrado
    : fechamentoConhecido;

  let saldo = arredondar2(ultimoFechamento ? saldoAssinadoPrestacao(ultimoFechamento) : 0);

  const dataInicio = ultimoFechamento
    ? deslocarData(ultimoFechamento.dataMovimento, 1)
    : config.inicioCortesiasJardas;

  if (!dataValidaISO(dataInicio) || dataInicio > dataFim) {
    if (!prestacaoIgnoradaId) cacheSaldoJardas.set(dataFim, saldo);
    return saldo;
  }

  const dias = {};

  registrosGuias
    .filter(registro =>
      ehAgenciaComissionada(registro.agencia) &&
      dataValidaISO(registro.data) &&
      registro.data >= dataInicio &&
      registro.data <= dataFim
    )
    .forEach(registro => {
      if (!dias[registro.data]) {
        dias[registro.data] = {
          adultos: 0,
          criancas: 0,
          valorPago: 0,
          passagens: 0,
          comissao: 0,
          valorAdulto: 0
        };
      }

      dias[registro.data].adultos += Number(registro.adultos) || 0;
      dias[registro.data].criancas += Number(registro.criancas) || 0;
      dias[registro.data].valorPago = somarMoeda(dias[registro.data].valorPago, registro.valorPago);
      dias[registro.data].passagens = somarMoeda(dias[registro.data].passagens, valorFaturamentoRegistro(registro));
      dias[registro.data].comissao = somarMoeda(dias[registro.data].comissao, valorComissaoRegistro(registro));

      if (!dias[registro.data].valorAdulto) {
        dias[registro.data].valorAdulto = valorAdultoRegistro(registro);
      }
    });

  Object.entries(dias)
    .sort(([dataA], [dataB]) => dataA.localeCompare(dataB))
    .forEach(([data, dia]) => {
      const cortesias = obterCortesiasDiariasJardas(data, dia.adultos, dia.valorAdulto);
      saldo = arredondar2(somarMoeda(saldo, dia.valorPago, dia.comissao, cortesias.valor) - dia.passagens);
    });

  const movimentoPagamentos = prestacoesJardas
    .filter(p => dataValidaISO(p.dataMovimento) && p.dataMovimento >= dataInicio && p.dataMovimento <= dataFim)
    .reduce((total, p) => somarMoeda(total, valorAssinadoPagamentoJardas(p)), 0);

  const saldoFinal = somarMoeda(saldo, movimentoPagamentos);

  if (!prestacaoIgnoradaId) cacheSaldoJardas.set(dataFim, saldoFinal);

  return saldoFinal;
}

function atualizarCampoValorPagoGuia() {
  const formaPagamento = document.getElementById('formaPagamentoGuia').value;
  const campoValor = document.getElementById('valorPagoGuia');

  const aceitaValor = Boolean(formaPagamento) && formaPagamento !== 'nao-pagou';

  campoValor.disabled = !aceitaValor;
  campoValor.className = `w-full border rounded p-2 mb-1 ${aceitaValor ? 'bg-white' : 'bg-gray-100'}`;

  if (!aceitaValor) campoValor.value = 0;
  if (aceitaValor && Number(campoValor.value) === 0) campoValor.value = '';
}

function calcularComissaoJardasPorAlmoco(almocaram, taxa = config.comissao) {
  return arredondar2((Number(almocaram) || 0) * (Number(taxa) || 0));
}

function valorFaturamentoRegistro(registro) {
  const bruto = registro?.faturamento;

  if (bruto !== undefined && bruto !== null && bruto !== '') {
    const numero = Number(bruto);
    if (Number.isFinite(numero)) return arredondar2(numero);
  }

  const valorAdulto = arredondar2(Number(registro?.valorAdultoAplicado) || config.adulto || 60);
  const valorCrianca = arredondar2(Number(registro?.valorCriancaAplicado) || config.crianca || 35);

  return arredondar2(
    ((Number(registro?.adultos) || 0) * valorAdulto) +
    ((Number(registro?.criancas) || 0) * valorCrianca)
  );
}

function valorAdultoRegistro(registro) {
  return arredondar2(Number(registro?.valorAdultoAplicado) || config.adulto || 60);
}

function valorComissaoRegistro(registro) {
  if (!registro || !ehAgenciaComissionada(registro.agencia)) return 0;

  const taxa = arredondar2(Number(registro.comissaoPorAdultoAplicada) || config.comissao || 5);

  const temAlmocaram = registro.almocaram !== undefined && registro.almocaram !== null;

  if (temAlmocaram) {
    return calcularComissaoJardasPorAlmoco(registro.almocaram, taxa);
  }

  const salva = Number(registro.comissao);
  if (Number.isFinite(salva)) return arredondar2(salva);

  return 0;
}

function descricaoGuiaVoucher(guia) {
  const criancas = guia.criancas > 0 ? ` ${guia.criancas}chd` : '';
  const pagamento = guia.valorPago > 0
    ? `  pg ${formatarValorCurto(guia.valorPago)} ${nomeFormaPagamentoGuia(guia.formaPagamento).toLocaleLowerCase('pt-BR')}`
    : '';

  return `${guia.nome}  ${guia.adultos} pax${criancas}${pagamento}`;
}

function criarArquivoVoucherJardas(voucher, sufixoArquivo = '') {
  const largura = 1080;
  const margem = 64;
  const alturaCabecalho = 230;

  const alturasDias = voucher.dias.map(dia => 560 + (dia.guias.length * 58));
  const alturaResumo = voucher.dias.length > 1 ? 660 : 460;
  const altura = alturaCabecalho + alturasDias.reduce((total, valor) => total + valor, 0) + alturaResumo + 90;

  const canvas = document.createElement('canvas');
  canvas.width = largura;
  canvas.height = altura;

  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#eef2f7';
  ctx.fillRect(0, 0, largura, altura);

  ctx.fillStyle = '#14532d';
  ctx.fillRect(0, 0, largura, alturaCabecalho);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 58px Arial, sans-serif';
  ctx.fillText('CONTAS JARDAS', margem, 92);

  ctx.font = '34px Arial, sans-serif';
  ctx.fillText(`${formatarDataRelatorio(voucher.dataInicio)} a ${formatarDataRelatorio(voucher.dataFim)}`, margem, 155);

  ctx.font = '26px Arial, sans-serif';
  ctx.fillStyle = '#bbf7d0';
  ctx.fillText('Controle Catamarã', margem, 202);

  let y = alturaCabecalho + 34;

  const desenharLinha = (texto, x, posY, tamanho = 32, cor = '#1f2937', negrito = false) => {
    let tamanhoAjustado = tamanho;
    const larguraDisponivel = largura - x - margem - 30;

    ctx.font = `${negrito ? 'bold ' : ''}${tamanhoAjustado}px Arial, sans-serif`;

    while (ctx.measureText(texto).width > larguraDisponivel && tamanhoAjustado > 20) {
      tamanhoAjustado -= 2;
      ctx.font = `${negrito ? 'bold ' : ''}${tamanhoAjustado}px Arial, sans-serif`;
    }

    ctx.fillStyle = cor;
    ctx.fillText(texto, x, posY);
  };

  voucher.dias.forEach((dia, indice) => {
    const alturaDia = alturasDias[indice] - 26;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();

    if (ctx.roundRect) {
      ctx.roundRect(margem, y, largura - (margem * 2), alturaDia, 24);
    } else {
      ctx.rect(margem, y, largura - (margem * 2), alturaDia);
    }

    ctx.fill();

    let linhaY = y + 62;

    desenharLinha(formatarDataRelatorio(dia.data), margem + 34, linhaY, 40, '#14532d', true);
    linhaY += 62;

    dia.guias.forEach(guia => {
      desenharLinha(descricaoGuiaVoucher(guia), margem + 34, linhaY, 31, '#111827');
      linhaY += 58;
    });

    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(margem + 34, linhaY - 15);
    ctx.lineTo(largura - margem - 34, linhaY - 15);
    ctx.stroke();

    desenharLinha(
      dia.fechamentoNoDia
        ? 'Fechamento realizado = contas zeradas'
        : (dia.creditoDoDia > 0
            ? `Crédito gerado no dia = ${formatarValorCurto(dia.creditoDoDia)}`
            : `Valor devido do dia = ${formatarValorCurto(dia.valorDevido)}`),
      margem + 34,
      linhaY + 30,
      28,
      dia.fechamentoNoDia ? '#15803d' : '#475569',
      dia.fechamentoNoDia
    );

    desenharLinha(`Total de pax = ${dia.adultos}${dia.criancas > 0 ? `+${dia.criancas}chd` : ''}`, margem + 34, linhaY + 78, 31, '#1f2937', true);
    desenharLinha(`Cortesias concedidas = ${dia.cortesiasConcedidas}`, margem + 34, linhaY + 126, 31);
    desenharLinha(`Valor total = ${formatarValorCurto(dia.passagens)}`, margem + 34, linhaY + 174, 31);
    desenharLinha(`Almoço = ${formatarValorCurto(dia.comissao)}`, margem + 34, linhaY + 222, 31);

    let calculo = `${formatarValorCurto(dia.passagens)}`;
    if (dia.valorPago > 0) calculo += ` - ${formatarValorCurto(dia.valorPago)} pago`;
    calculo += ` - ${formatarValorCurto(dia.comissao)} almoço`;
    if (dia.valorCortesiasConcedidas > 0) calculo += ` - ${formatarValorCurto(dia.valorCortesiasConcedidas)} cortesias`;
    if (dia.valorAbatido > 0) calculo += ` - ${formatarValorCurto(dia.valorAbatido)} pagamento abatido`;

    desenharLinha(`Cálculo = ${calculo}`, margem + 34, linhaY + 270, 27, '#475569');

    const restanteDia = arredondar2(dia.restante);
    const corSaldo = restanteDia > 0.009 ? '#b91c1c' : '#15803d';

    desenharLinha('RESTANTE DESTE DIA', margem + 34, linhaY + 340, 30, '#475569', true);
    desenharLinha(formatarMoeda(restanteDia), margem + 34, linhaY + 408, 46, corSaldo, true);

    y += alturasDias[indice];
  });

  ctx.fillStyle = '#dcfce7';
  ctx.beginPath();

  if (ctx.roundRect) {
    ctx.roundRect(margem, y, largura - (margem * 2), alturaResumo - 30, 24);
  } else {
    ctx.rect(margem, y, largura - (margem * 2), alturaResumo - 30);
  }

  ctx.fill();

  if (voucher.dias.length > 1) {
    let resumoY = y + 58;

    desenharLinha('TOTAL DO PERÍODO', margem + 34, resumoY, 38, '#14532d', true);
    desenharLinha(`Saldo anterior = ${situacaoSaldoJardas(voucher.saldoAnterior).texto}`, margem + 34, resumoY + 58, 28, '#475569');
    desenharLinha(`Total de pax = ${voucher.adultos}${voucher.criancas > 0 ? `+${voucher.criancas}chd` : ''}`, margem + 34, resumoY + 116, 30);
    desenharLinha(`Cortesias concedidas = ${voucher.cortesiasConcedidas} (- ${formatarValorCurto(voucher.valorCortesiasConcedidas)})`, margem + 34, resumoY + 174, 30);
    desenharLinha(`Valor total = ${formatarValorCurto(voucher.passagens)}`, margem + 34, resumoY + 232, 30);
    desenharLinha(`Almoço = ${formatarValorCurto(voucher.comissao)}`, margem + 34, resumoY + 290, 30);
    desenharLinha(`Pagamentos de guias = ${formatarValorCurto(voucher.valorPago)}`, margem + 34, resumoY + 348, 30);
    desenharLinha(`Pagamentos abatidos = ${formatarValorCurto(voucher.valorAbatido)}`, margem + 34, resumoY + 396, 30);
    desenharLinha('SALDO FINAL TOTAL', margem + 34, resumoY + 454, 30, '#475569', true);
    desenharLinha(situacaoSaldoJardas(voucher.saldo).texto, margem + 34, resumoY + 522, 46, voucher.saldo < 0 ? '#b91c1c' : (voucher.saldo > 0 ? '#6b21a8' : '#15803d'), true);
  } else {
    const resumoY = y + 58;
    const dataSaldoAnterior = deslocarData(voucher.dataInicio, -1);
    const movimentoDoDia = arredondar2(voucher.saldo - voucher.saldoAnterior);

    desenharLinha('COMPOSIÇÃO DO SALDO', margem + 34, resumoY, 34, '#14532d', true);
    desenharLinha(
      `Saldo acumulado até ${formatarDataRelatorio(dataSaldoAnterior)} = ${situacaoSaldoJardas(voucher.saldoAnterior).texto}`,
      margem + 34,
      resumoY + 64,
      28,
      '#475569'
    );
    desenharLinha(
      `Movimento de ${formatarDataRelatorio(voucher.dataInicio)} = ${situacaoSaldoJardas(movimentoDoDia).texto}`,
      margem + 34,
      resumoY + 122,
      28,
      '#475569'
    );
    desenharLinha('SALDO FINAL TOTAL', margem + 34, resumoY + 206, 30, '#475569', true);
    desenharLinha(situacaoSaldoJardas(voucher.saldo).texto, margem + 34, resumoY + 282, 48, voucher.saldo < 0 ? '#b91c1c' : (voucher.saldo > 0 ? '#6b21a8' : '#15803d'), true);
  }

  const dataUrl = canvas.toDataURL('image/png');
  const binario = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(binario.length);

  for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);

  return new File([bytes], `voucher-jardas-${voucher.dataInicio}-${voucher.dataFim}${sufixoArquivo}.png`, { type: 'image/png' });
}

function criarArquivosVoucherJardas(voucher) {
  const diasPorPagina = 5;

  if (voucher.dias.length <= diasPorPagina) {
    return [criarArquivoVoucherJardas(voucher)];
  }

  const arquivos = [];
  const totalPaginas = Math.ceil(voucher.dias.length / diasPorPagina);

  for (let inicio = 0; inicio < voucher.dias.length; inicio += diasPorPagina) {
    const numeroPagina = Math.floor(inicio / diasPorPagina) + 1;

    const voucherPagina = {
      ...voucher,
      dias: voucher.dias.slice(inicio, inicio + diasPorPagina)
    };

    arquivos.push(criarArquivoVoucherJardas(voucherPagina, `-pagina-${numeroPagina}-de-${totalPaginas}`));
  }

  return arquivos;
}

async function compartilharVoucherJardas(voucherId, botao) {
  atualizarTela();

  const voucher = vouchersJardas[voucherId];
  if (!voucher) return alert('Gere o relatório novamente para criar o voucher.');

  const textoOriginal = botao.innerText;
  botao.disabled = true;
  botao.innerText = 'Criando voucher...';

  try {
    const arquivos = criarArquivosVoucherJardas(voucher);

    if (navigator.share && navigator.canShare && navigator.canShare({ files: arquivos })) {
      await navigator.share({ files: arquivos, title: 'Contas Jardas' });
    } else {
      arquivos.forEach((arquivo, indice) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(arquivo);
        link.download = arquivo.name;

        setTimeout(() => {
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 3000);
        }, indice * 350);
      });

      alert(`${arquivos.length} imagem${arquivos.length === 1 ? '' : 'ns'} do voucher ${arquivos.length === 1 ? 'foi baixada' : 'foram baixadas'}. Agora envie pelo WhatsApp.`);
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      alert('Não foi possível compartilhar o voucher: ' + error.message);
    }
  } finally {
    botao.disabled = false;
    botao.innerText = textoOriginal;
  }
}

function chaveEmbarcacao(nome) {
  const chaveBase = String(nome || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase('pt-BR')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();

  const apelidos = {
    'verlho bill': 'velho bill',
    'ranildo': 'ranildo mundinho',
    'mundinho': 'ranildo mundinho'
  };

  return apelidos[chaveBase] || chaveBase;
}

function capitalizarNomeEmbarcacao(nome) {
  return String(nome || '')
    .replace(/\s+/g, ' ')
    .trim()
    .toLocaleLowerCase('pt-BR')
    .replace(/(^|[\s-])([a-zà-öø-ÿ])/g, (_, separador, letra) => separador + letra.toLocaleUpperCase('pt-BR'));
}

function nomeCanonicoEmbarcacao(nome) {
  const chave = chaveEmbarcacao(nome);

  const nomesConhecidos = {
    'velho bill': 'Velho Bill',
    'ze maria': 'Zé Maria',
    'ranildo mundinho': 'Ranildo / Mundinho'
  };

  if (nomesConhecidos[chave]) return nomesConhecidos[chave];

  const candidatos = registrosEmbarcacoes
    .map(registro => registro.catamaran)
    .filter(candidato => chaveEmbarcacao(candidato) === chave)
    .sort((a, b) => {
      const acentosA = (String(a).match(/[^\x00-\x7F]/g) || []).length;
      const acentosB = (String(b).match(/[^\x00-\x7F]/g) || []).length;
      return acentosB - acentosA;
    });

  return capitalizarNomeEmbarcacao(candidatos[0] || nome);
}

function mesmaEmbarcacao(nomeA, nomeB) {
  return chaveEmbarcacao(nomeA) === chaveEmbarcacao(nomeB);
}

function obterDadosRelatorioBarco() {
  const nome = document.getElementById('relatorioBarcoNome').value;
  const dataInicio = document.getElementById('relatorioBarcoDataInicio').value;
  const dataFim = document.getElementById('relatorioBarcoDataFim').value;

  const dados = ordenarPorDataHora(
    registrosEmbarcacoes.filter(e =>
      mesmaEmbarcacao(e.catamaran, nome) &&
      dataValidaISO(e.data) &&
      e.data >= dataInicio &&
      e.data <= dataFim
    )
  );

  return { nome, dataInicio, dataFim, dados };
}

function totalizarRelatorioBarco(dados) {
  return dados.reduce((total, registro) => {
    total.adultos += Number(registro.adultos) || 0;
    total.criancas += Number(registro.criancas) || 0;
    total.bebes += Number(registro.bebes) || 0;
    total.cortesia += Number(registro.cortesia) || 0;
    total.totalPax += Number(registro.totalPax) || 0;
    total.valorRepasse = somarMoeda(total.valorRepasse, registro.valorRepasse);
    return total;
  }, {
    adultos: 0,
    criancas: 0,
    bebes: 0,
    cortesia: 0,
    totalPax: 0,
    valorRepasse: 0
  });
}

function agruparRelatorioBarcoPorDia(dados) {
  const grupos = dados.reduce((porDia, registro) => {
    if (!porDia[registro.data]) porDia[registro.data] = [];
    porDia[registro.data].push(registro);
    return porDia;
  }, {});

  return Object.keys(grupos)
    .sort((a, b) => b.localeCompare(b))
    .map(data => ({
      data,
      lancamentos: grupos[data],
      totais: totalizarRelatorioBarco(grupos[data])
    }));
}

function atualizarOpcoesRelatorioBarco() {
  const select = document.getElementById('relatorioBarcoNome');
  const selecionado = select.value;

  const barcos = [...new Set(
    registrosEmbarcacoes
      .map(e => nomeCanonicoEmbarcacao(e.catamaran))
      .filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, 'pt-BR'));

  select.innerHTML = '<option value="">Selecione uma embarcação</option>' +
    barcos.map(barco => `<option value="${escaparHTML(barco)}">${escaparHTML(barco)}</option>`).join('');

  if (barcos.includes(selecionado)) {
    select.value = selecionado;
  }

  atualizarPeriodoRelatorioBarco();
}

function formatarDataRelatorio(data) {
  if (!dataValidaISO(data)) return '--';
  const [ano, mes, dia] = data.split('-');
  return `${dia}/${mes}/${ano}`;
}

function atualizarPeriodoRelatorioBarco(redefinirPeriodo = false) {
  const nome = document.getElementById('relatorioBarcoNome').value;
  const campoInicio = document.getElementById('relatorioBarcoDataInicio');
  const campoFim = document.getElementById('relatorioBarcoDataFim');

  const datas = [...new Set(
    registrosEmbarcacoes
      .filter(registro => mesmaEmbarcacao(registro.catamaran, nome) && dataValidaISO(registro.data))
      .map(registro => registro.data)
  )].sort((a, b) => a.localeCompare(b));

  if (datas.length === 0) {
    campoInicio.value = '';
    campoFim.value = '';
    campoInicio.removeAttribute('min');
    campoInicio.removeAttribute('max');
    campoFim.removeAttribute('min');
    campoFim.removeAttribute('max');
  } else {
    const primeiraData = datas[0];
    const ultimaData = datas[datas.length - 1];

    campoInicio.min = primeiraData;
    campoInicio.max = ultimaData;
    campoFim.min = primeiraData;
    campoFim.max = ultimaData;

    if (redefinirPeriodo || !campoInicio.value || campoInicio.value < primeiraData || campoInicio.value > ultimaData) {
      campoInicio.value = primeiraData;
    }

    if (redefinirPeriodo || !campoFim.value || campoFim.value < primeiraData || campoFim.value > ultimaData) {
      campoFim.value = ultimaData;
    }
  }

  if (redefinirPeriodo) {
    document.getElementById('relatorio-barco-resultado').innerHTML =
      '<p class="text-gray-500 text-sm text-center">Confira o período e toque em gerar relatório.</p>';
    document.getElementById('exportar-relatorio-barco').classList.add('hidden');
  }
}

function gerarRelatorioBarco() {
  const { nome, dataInicio, dataFim, dados } = obterDadosRelatorioBarco();

  const resultado = document.getElementById('relatorio-barco-resultado');
  const botaoExportar = document.getElementById('exportar-relatorio-barco');

  if (!nome || !dataInicio || !dataFim) {
    resultado.innerHTML = '<p class="text-gray-500 text-sm text-center">Selecione uma embarcação e o período.</p>';
    botaoExportar.classList.add('hidden');
    return;
  }

  if (dataInicio > dataFim) {
    resultado.innerHTML = '<p class="text-red-600 text-sm text-center">A data inicial não pode ser posterior à data final.</p>';
    botaoExportar.classList.add('hidden');
    return;
  }

  if (dados.length === 0) {
    resultado.innerHTML = `<p class="text-gray-500 text-sm text-center">Nenhum lançamento de <strong>${escaparHTML(nome)}</strong> entre ${formatarDataRelatorio(dataInicio)} e ${formatarDataRelatorio(dataFim)}.</p>`;
    botaoExportar.classList.add('hidden');
    return;
  }

  const totais = totalizarRelatorioBarco(dados);
  const dias = agruparRelatorioBarcoPorDia(dados);

  const periodoTexto = dataInicio === dataFim
    ? `Data: ${formatarDataRelatorio(dataInicio)}`
    : `Período: ${formatarDataRelatorio(dataInicio)} a ${formatarDataRelatorio(dataFim)}`;

  const resumoDias = dias.map(dia => `
    <div class="bg-white border border-blue-100 rounded-lg p-3 mt-2">
      <div class="flex justify-between items-start gap-2">
        <div>
          <div class="font-bold text-blue-800">${formatarDataRelatorio(dia.data)}</div>
          <div class="text-xs text-gray-500">${dia.lancamentos.length} lançamento${dia.lancamentos.length === 1 ? '' : 's'}</div>
        </div>
        <div class="text-right">
          <div class="text-xl font-bold text-blue-800">${dia.totais.totalPax}</div>
          <div class="text-xs text-gray-500">passageiros</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-1 mt-2 text-xs text-gray-700">
        <span>👨 Adultos: <strong>${dia.totais.adultos}</strong></span>
        <span>🧒 Crianças: <strong>${dia.totais.criancas}</strong></span>
        <span>👶 Bebês: <strong>${dia.totais.bebes}</strong></span>
        <span>🎁 Cortesias: <strong>${dia.totais.cortesia}</strong></span>
      </div>

      <div class="text-right text-xs font-bold text-green-700 mt-2">Repasse: ${formatarMoeda(dia.totais.valorRepasse)}</div>
    </div>
  `).join('');

  resultado.innerHTML = `
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
      <div class="flex justify-between items-start mb-3">
        <div>
          <div class="font-bold text-blue-800">${escaparHTML(nome)}</div>
          <div class="text-xs text-gray-500">${periodoTexto} · ${dias.length} dia${dias.length === 1 ? '' : 's'} com embarque</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-gray-500">Total do repasse</div>
          <div class="font-bold text-green-700">${formatarMoeda(totais.valorRepasse)}</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-sm">
        <div class="bg-white rounded p-2">👨 Adultos: <strong>${totais.adultos}</strong></div>
        <div class="bg-white rounded p-2">🧒 Crianças: <strong>${totais.criancas}</strong></div>
        <div class="bg-white rounded p-2">👶 Bebês: <strong>${totais.bebes}</strong></div>
        <div class="bg-white rounded p-2">🎁 Cortesias: <strong>${totais.cortesia}</strong></div>
      </div>

      <div class="flex justify-between border-t border-blue-200 mt-3 pt-3 font-bold">
        <span>Total de passageiros</span>
        <span class="text-blue-800">${totais.totalPax}</span>
      </div>

      <div class="mt-4 pt-3 border-t border-blue-200">
        <div class="font-bold text-sm text-blue-800 mb-1">Movimento por dia</div>
        ${resumoDias}
      </div>
    </div>
  `;

  botaoExportar.classList.remove('hidden');
}

function ordenarPorDataHora(array) {
  return array.sort((a, b) => {
    const dataA = String(a.data || '');
    const dataB = String(b.data || '');

    if (dataA === dataB) {
      return String(a.hora || '').localeCompare(String(b.hora || ''));
    }

    return dataA.localeCompare(dataB);
  });
}

function calcularValorJacilene(adultos) {
  const totalAdultos = Number(adultos) || 0;

  if (totalAdultos < 13) {
    return { calculavel: false, paxAplicado: totalAdultos, valor: 0 };
  }

  const paxAplicado = Math.min(totalAdultos, 18);

  return {
    calculavel: true,
    paxAplicado,
    valor: arredondar2(tabelaJacilene[paxAplicado])
  };
}

function atualizarHistoricoJacilene() {
  const container = document.getElementById('historico-jacilene');
  if (!container) return;

  const pagamentos = prestacoes
    .filter(p => p.tipo === 'jacilene')
    .sort((a, b) => momentoPrestacao(b).localeCompare(momentoPrestacao(a)));

  if (pagamentos.length === 0) {

  }

  container.innerHTML = pagamentos.map(p => `
    <div class="bg-pink-50 border-l-4 border-pink-500 rounded p-3">
      <div class="flex justify-between font-bold">
        <span>${descricaoMovimentoPrestacao(p)}</span>

      </div>
      <div class="text-xs text-gray-500">Pago em ${formatarDataHistorico(p.dataPrestacao)} ${escaparHTML(p.horaPrestacao || '')}</div>
      ${p.observacao ? `<div class="text-xs text-gray-700 mt-1">💬 ${escaparHTML(p.observacao)}</div>` : ''}
    </div>
  `).join('');
}

function atualizarJacilene() {
  const dataInicio = document.getElementById('jacileneDataInicio').value;
  const dataFim = document.getElementById('jacileneDataFim').value;

  const lista = document.getElementById('jacilene-lista');
  const resumo = document.getElementById('jacilene-resumo');
  const totalElemento = document.getElementById('jacilene-total');
  const saldoElemento = document.getElementById('jacilene-saldo-devedor');
  const saldoCard = document.getElementById('jacilene-saldo-card');

  const atualizarSaldoDevedor = valor => {
    const saldo = arredondar2(valor);
    saldoElemento.innerText = formatarMoeda(saldo);
    saldoElemento.className = `font-bold ${saldo > 0 ? 'text-red-600' : 'text-green-700'}`;
    saldoCard.className = `${saldo > 0 ? 'bg-red-50' : 'bg-green-50'} rounded-lg p-2 text-right`;
  };

  if (!dataInicio || !dataFim) {
    lista.innerHTML = '<p class="text-gray-500 text-sm text-center">Selecione o período.</p>';
    resumo.innerText = '';
    totalElemento.innerText = formatarMoeda(0);
    atualizarSaldoDevedor(0);
    atualizarHistoricoJacilene();
    return;
  }

  if (dataInicio > dataFim) {
    lista.innerHTML = '<p class="text-red-600 text-sm text-center">A data inicial não pode ser posterior à data final.</p>';
    resumo.innerText = '';
    totalElemento.innerText = formatarMoeda(0);
    atualizarSaldoDevedor(0);
    atualizarHistoricoJacilene();
    return;
  }

  const porData = registrosEmbarcacoes
    .filter(registro =>
      mesmaEmbarcacao(registro.catamaran, 'Velho Bill') &&
      dataValidaISO(registro.data) &&
      registro.data >= dataInicio &&
      registro.data <= dataFim
    )
    .reduce((dias, registro) => {
      if (!dias[registro.data]) dias[registro.data] = { adultos: 0, lancamentos: 0 };
      dias[registro.data].adultos += Number(registro.adultos) || 0;
      dias[registro.data].lancamentos += 1;
      return dias;
    }, {});

  const dias = Object.entries(porData).sort(([dataA], [dataB]) => dataA.localeCompare(dataB));

  if (dias.length === 0) {
    lista.innerHTML = '<p class="text-gray-500 text-sm text-center">Nenhum embarque do Velho Bill no período.</p>';
    resumo.innerText = `Período: ${formatarDataRelatorio(dataInicio)} a ${formatarDataRelatorio(dataFim)}`;
    totalElemento.innerText = formatarMoeda(0);
    atualizarSaldoDevedor(0);
    atualizarHistoricoJacilene();
    return;
  }

  let total = 0;
  let saldoDevedor = 0;
  let diasCalculados = 0;
  let diasSemRegra = 0;

  lista.innerHTML = dias.map(([data, dadosDia]) => {
    const calculo = calcularValorJacilene(dadosDia.adultos);

    if (!calculo.calculavel) {
      diasSemRegra += 1;

      return `
        <div class="bg-orange-50 border border-orange-300 rounded-lg p-3">
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="font-bold">${formatarDataRelatorio(data)}</div>
              <div class="text-xs text-gray-600">${dadosDia.adultos} adultos</div>
            </div>
            <div class="text-right text-xs font-bold text-orange-700">Valor não definido</div>
          </div>
          <div class="text-xs text-orange-700 mt-2">A tabela recebida começa em 13 PAX. Este dia não pode ser marcado como pago.</div>
        </div>
      `;
    }

    diasCalculados += 1;
    total = somarMoeda(total, calculo.valor);

    saldoDevedor = somarMoeda(
      saldoDevedor,
      obterResumoPagamentoDiario('jacilene', 'Jacilene', data, calculo.valor).saldoRestante
    );

    const limite = dadosDia.adultos > 18
      ? ` · cálculo limitado a 18 PAX`
      : ` · ${calculo.paxAplicado} PAX`;

    const lancamentos = dadosDia.lancamentos > 1
      ? ` · ${dadosDia.lancamentos} lançamentos somados`
      : '';

    return renderizarLinhaPagamentoDiario(
      'jacilene',
      'Jacilene',
      data,
      calculo.valor,
      `${dadosDia.adultos} adultos${limite}${lancamentos}`
    );
  }).join('');

  totalElemento.innerText = formatarMoeda(total);
  atualizarSaldoDevedor(saldoDevedor);

  resumo.innerText = `${diasCalculados} dia${diasCalculados === 1 ? '' : 's'} calculado${diasCalculados === 1 ? '' : 's'}` +
    (diasSemRegra ? ` · ${diasSemRegra} dia${diasSemRegra === 1 ? '' : 's'} abaixo de 13 adultos` : '');

  atualizarHistoricoJacilene();
}

function encerrarCarregamentoDados() {
  canceladoresSnapshot.forEach(cancelar => {
    try {
      cancelar();
    } catch (erro) {
      console.warn('Falha ao encerrar sincronização:', erro);
    }
  });

  canceladoresSnapshot = [];
}

function carregarDados() {
  encerrarCarregamentoDados();

  try {
    canceladoresSnapshot.push(db.collection('registrosGuias').onSnapshot((snapshot) => {
      try {
        registrosGuias = [];
        snapshot.forEach((doc) => {
          registrosGuias.push({ id: doc.id, ...doc.data() });
        });

        agendarAtualizacaoTela();
        atualizarIndicadorSync(navigator.onLine);
      } catch (err) {
        console.error('Erro ao processar guias:', err);
      }
    }, (error) => {
      console.error('Erro ao carregar guias:', error);
      atualizarIndicadorSync(false);
    }));

    canceladoresSnapshot.push(db.collection('registrosEmbarcacoes').onSnapshot((snapshot) => {
      try {
        registrosEmbarcacoes = [];
        snapshot.forEach((doc) => {
          registrosEmbarcacoes.push({ id: doc.id, ...doc.data() });
        });

        agendarAtualizacaoTela();
        atualizarIndicadorSync(navigator.onLine);
      } catch (err) {
        console.error('Erro ao processar embarcações:', err);
      }
    }, (error) => {
      console.error('Erro ao carregar embarcações:', error);
      atualizarIndicadorSync(false);
    }));

    canceladoresSnapshot.push(db.collection('prestacoes').onSnapshot((snapshot) => {
      try {
        prestacoes = [];
        snapshot.forEach((doc) => {
          prestacoes.push({ id: doc.id, ...doc.data() });
        });

        agendarAtualizacaoTela();
      } catch (err) {
        console.error('Erro ao processar prestações:', err);
      }
    }, (error) => {
      console.error('Erro ao carregar prestações:', error);
    }));

    canceladoresSnapshot.push(db.collection('historicoExclusoes').onSnapshot((snapshot) => {
      historicoExclusoes = [];
      snapshot.forEach(doc => historicoExclusoes.push({ id: doc.id, ...doc.data() }));
      atualizarHistorico();
    }, (error) => console.error('Erro ao carregar histórico de exclusões:', error)));

    canceladoresSnapshot.push(db.collection('config').doc('principal').onSnapshot((doc) => {
      try {
        if (doc.exists) {
          config = normalizarConfig(doc.data());
          carregarConfig();
        }
      } catch (err) {
        console.error('Erro ao carregar config:', err);
      }
    }, (error) => {
      console.error('Erro ao carregar config:', error);
    }));
  } catch (err) {
    console.error('Erro geral ao carregar:', err);
  }
}

function salvarGuia() {
  const registroExistente = guiaEmEdicaoId
    ? registrosGuias.find(item => item.id === guiaEmEdicaoId)
    : null;

  let data = registroExistente?.data || dataGlobal;

  if (!dataValidaISO(data)) data = dataGlobal;
  if (!dataValidaISO(data)) return alert('Data inválida. Selecione uma data válida.');

  const guia = document.getElementById('nomeGuia').value.trim();
  let agencia = document.getElementById('agenciaGuia').value.trim();
  const formaPagamento = document.getElementById('formaPagamentoGuia').value;

  let valorPago = obterValorMonetario('valorPagoGuia');

  const ad = obterNumero('adultosGuia');
  const cr = obterNumero('criancasGuia');
  const bb = obterNumero('bebesGuia');
  const cort = obterNumero('cortesiaGuia');
  const alm = obterNumero('almocaramGuia');

  if (!guia || !agencia) return alert('Preencha Guia e Agência!');

  if (pareceAgenciaJardas(agencia)) {
    const corrigir = confirm(`A agência “${agencia}” é parecida com Jardas.
OK = corrigir para Jardas
Cancelar = voltar e revisar o nome`);

    if (!corrigir) return document.getElementById('agenciaGuia').focus();

    agencia = 'Jardas';
    document.getElementById('agenciaGuia').value = agencia;
  }

  if (!formaPagamento) return alert('Selecione a forma de pagamento!');

  if (formaPagamento === 'nao-pagou') {
    valorPago = 0;
  } else if (valorPago <= 0) {
    return alert('Informe o valor que foi pago!');
  }

  const totalEmbarque = ad + cr + bb + cort;

  const valorAdultoAplicado = arredondar2(registroExistente?.valorAdultoAplicado ?? config.adulto);
  const valorCriancaAplicado = arredondar2(registroExistente?.valorCriancaAplicado ?? config.crianca);
  const comissaoPorAlmocoAplicada = arredondar2(registroExistente?.comissaoPorAdultoAplicada ?? config.comissao);

  const tarifasNovas = !registroExistente;

  const faturamento = arredondar2(
    (ad * (tarifasNovas ? arredondar2(config.adulto) : valorAdultoAplicado)) +
    (cr * (tarifasNovas ? arredondar2(config.crianca) : valorCriancaAplicado))
  );

  const comissao = ehAgenciaComissionada(agencia)
    ? calcularComissaoJardasPorAlmoco(alm, tarifasNovas ? config.comissao : comissaoPorAlmocoAplicada)
    : 0;

  const dadosRegistro = {
    data,
    hora: registroExistente?.hora || new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    guia,
    agencia,
    formaPagamento,
    valorPago,
    adultos: ad,
    criancas: cr,
    bebes: bb,
    cortesia: cort,
    almocaram: alm,
    faturamento,
    comissao,
    valorAdultoAplicado: tarifasNovas ? arredondar2(config.adulto) : valorAdultoAplicado,
    valorCriancaAplicado: tarifasNovas ? arredondar2(config.crianca) : valorCriancaAplicado,
    comissaoPorAdultoAplicada: tarifasNovas ? arredondar2(config.comissao) : comissaoPorAlmocoAplicada,
    totalPax: totalEmbarque
  };

  const operacao = guiaEmEdicaoId
    ? db.collection('registrosGuias').doc(guiaEmEdicaoId).update({
        ...dadosRegistro,
        atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
      })
    : db.collection('registrosGuias').add({
        ...dadosRegistro,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

  const mensagemSucesso = guiaEmEdicaoId ? 'Lançamento alterado!' : 'Guia adicionado!';

  operacao
    .then(() => {
      limparFormularioGuia();
      alert(mensagemSucesso);
    })
    .catch((error) => alert('Erro: ' + error.message));
}

function salvarBarco() {
  const data = dataGlobal;

  if (!dataValidaISO(data)) return alert('Data inválida. Selecione uma data válida.');

  const barco = nomeCanonicoEmbarcacao(document.getElementById('nomeBarco').value.trim());

  const ad = obterNumero('adultosBarco');
  const cr = obterNumero('criancasBarco');
  const bb = obterNumero('bebesBarco');
  const cort = obterNumero('cortesiaBarco');

  if (!barco) return alert('Preencha o Catamarã!');

  if (registrosEmbarcacoes.some(registro => registro.data === data && mesmaEmbarcacao(registro.catamaran, barco))) {
    return alert(`Já existe um lançamento de ${barco} em ${formatarDataRelatorio(data)}. Para corrigir, exclua o lançamento existente antes de cadastrar novamente.`);
  }

  const totalPax = ad + cr + bb + cort;
  if (totalPax <= 0) return alert('Informe pelo menos uma pessoa.');

  const faturamento = arredondar2((ad * arredondar2(config.adulto)) + (cr * arredondar2(config.crianca)));

  const novoRegistro = {
    data,
    hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    catamaran: barco,
    adultos: ad,
    criancas: cr,
    bebes: bb,
    cortesia: cort,
    totalPax,
    valorRepasse: faturamento,
    valorAdultoAplicado: arredondar2(config.adulto),
    valorCriancaAplicado: arredondar2(config.crianca),
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };

  const idDoc = `${data}_${chaveEmbarcacao(barco)}`;

  db.collection('registrosEmbarcacoes').doc(idDoc).set(novoRegistro)
    .then(() => {
      document.getElementById('nomeBarco').value = '';

      document.getElementById('bebesBarco').value = 0;
      document.getElementById('cortesiaBarco').value = 0;
      alert('Embarcação registrada!');
    })
    .catch((error) => alert('Erro: ' + error.message));
}

function mesmaPartePrestacao(tipo, nomePrestacao, nomeComparado) {
  if (tipo === 'catamara') return mesmaEmbarcacao(nomePrestacao, nomeComparado);
  if (tipo === 'agencia') return chaveAgencia(nomePrestacao) === chaveAgencia(nomeComparado);
  return nomePrestacao === nomeComparado;
}

function obterPrestacoesDiarias(tipo, nome, dataMovimento) {
  return prestacoes
    .filter(p =>
      p.tipo === tipo &&
      mesmaPartePrestacao(tipo, p.nome, nome) &&
      (
        p.dataMovimento === dataMovimento ||
        (!p.dataMovimento && p.periodoInicio === dataMovimento && p.periodoFim === dataMovimento)
      )
    )
    .sort((a, b) => {
      const momentoA = `${a.dataPrestacao || ''} ${a.horaPrestacao || ''}`;
      const momentoB = `${b.dataPrestacao || ''} ${b.horaPrestacao || ''}`;
      return momentoB.localeCompare(momentoA);
    });
}

function obterPrestacaoDiaria(tipo, nome, dataMovimento) {
  return obterPrestacoesDiarias(tipo, nome, dataMovimento)[0];
}

function calcularResumoValoresPagamento(pagamentos, valorTotal) {
  const totalDoDia = arredondar2(valorTotal);

  const totalPago = pagamentos.reduce((total, pagamento) =>
    somarMoeda(total, Number(pagamento.valor) || 0),
  0);

  const saldoRestante = arredondar2(Math.max(0, totalDoDia - totalPago));
  const excedente = arredondar2(Math.max(0, totalPago - totalDoDia));

  return {
    totalPago,
    saldoRestante,
    excedente,
    quitado: totalDoDia > 0 && totalPago > 0 && saldoRestante < 0.01,
    parcial: totalPago > 0 && saldoRestante >= 0.01
  };
}

function obterResumoPagamentoDiario(tipo, nome, dataMovimento, valorTotal) {
  const pagamentos = obterPrestacoesDiarias(tipo, nome, dataMovimento);

  return {
    pagamentos,
    ...calcularResumoValoresPagamento(pagamentos, valorTotal)
  };
}

function atualizarPreviaPagamento() {
  if (!pagamentoEmEdicao) return;

  const elemento = document.getElementById('pagamento-restante');
  const valorDigitado = String(document.getElementById('pagamento-valor-parcela').value).replace(',', '.');
  const valorPagamento = arredondar2(Number(valorDigitado));

  if (!Number.isFinite(valorPagamento) || valorPagamento <= 0) {
    elemento.className = 'text-xs font-bold text-red-600 mb-1';
    elemento.innerText = 'Informe um valor maior que zero.';
    return;
  }

  if (pagamentoEmEdicao.tipo === 'agencia') {
    elemento.className = 'text-xs font-bold text-purple-700 mb-1';
    elemento.innerText = 'Este valor será abatido do saldo acumulado, inclusive de datas anteriores.';
    atualizarCampoSaldoPrestacao();
    return;
  }

  if (valorPagamento > pagamentoEmEdicao.valorMaximo + 0.009) {
    elemento.className = 'text-xs font-bold text-red-600 mb-1';
    elemento.innerText = `Valor acima do disponível em ${formatarMoeda(valorPagamento - pagamentoEmEdicao.valorMaximo)}.`;
    return;
  }

  const restante = arredondar2(Math.max(0, pagamentoEmEdicao.valorMaximo - valorPagamento));

  elemento.className = restante < 0.01
    ? 'text-xs font-bold text-green-700 mb-1'
    : 'text-xs font-bold text-orange-700 mb-1';

  elemento.innerText = restante < 0.01
    ? '✅ Este pagamento quitará esta data.'
    : `🟡 Depois deste pagamento ainda faltarão ${formatarMoeda(restante)}.`;
}

function atualizarCampoSaldoPrestacao() {
  if (!pagamentoEmEdicao || pagamentoEmEdicao.tipo !== 'agencia') return;

  const valorDigitado = arredondar2(Number(String(document.getElementById('pagamento-valor-parcela').value).replace(',', '.')) || 0);

  const saldoAntes = calcularSaldoJardasAte(
    pagamentoEmEdicao.dataMovimento,
    pagamentoEmEdicao.prestacaoId
  );

  const saldoAutomatico = aplicarPagamentoAoSaldo(saldoAntes, valorDigitado);

  const tipoSaldo = saldoAutomatico < -0.009
    ? 'jardas-deve'
    : (saldoAutomatico > 0.009 ? 'nos-devemos' : 'zerado');

  const valorSaldo = arredondar2(Math.abs(saldoAutomatico));

  document.getElementById('saldo-prestacao-tipo').value = tipoSaldo;
  document.getElementById('saldo-prestacao-valor').value = valorSaldo > 0.009 ? valorSaldo.toFixed(2) : '';
  document.getElementById('saldo-prestacao-automatico').innerText = situacaoSaldoJardas(saldoAutomatico).texto;
  document.getElementById('pagamento-saldo').innerText = situacaoSaldoJardas(saldoAutomatico).texto;
}

function abrirPagamentoDiario(tipo, nome, dataMovimento, valor, prestacaoId = null) {
  if (!dataValidaISO(dataMovimento)) return alert('Data inválida para pagamento.');

  const ultimoFechamento = dataUltimoFechamentoJardas();

  if (tipo === 'agencia' && !prestacaoId && ultimoFechamento && dataMovimento <= ultimoFechamento) {
    return alert(`As contas já foram fechadas até ${formatarDataRelatorio(ultimoFechamento)}. Registre o pagamento em uma data posterior.`);
  }

  const nomePrestacao = tipo === 'catamara' ? nomeCanonicoEmbarcacao(nome) : nome;

  const pagamentos = obterPrestacoesDiarias(tipo, nomePrestacao, dataMovimento);

  const existente = prestacaoId
    ? pagamentos.find(p => p.id === prestacaoId)
    : null;

  const valorTotal = arredondar2(valor);

  const valorPagoOutros = pagamentos.reduce((total, pagamento) =>
    pagamento.id === existente?.id
      ? total
      : somarMoeda(total, Number(pagamento.valor) || 0),
  0);

  const valorMaximo = tipo === 'agencia'
    ? Number.POSITIVE_INFINITY
    : arredondar2(Math.max(0, valorTotal - valorPagoOutros));

  const valorInicial = existente
    ? arredondar2(Number(existente.valor) || 0)
    : (tipo === 'agencia' ? 0 : valorMaximo);

  pagamentoEmEdicao = {
    tipo,
    nome: nomePrestacao,
    dataMovimento,
    valorTotal,
    valorPagoOutros,
    valorMaximo,
    prestacaoId: existente?.id || null,
    prestacaoExistente: existente || null
  };

  document.getElementById('pagamento-nome').innerText = nomePrestacao;
  document.getElementById('pagamento-data').innerText = formatarDataRelatorio(dataMovimento);

  const saldoAntes = tipo === 'agencia'
    ? calcularSaldoJardasAte(dataMovimento, existente?.id || null)
    : valorTotal;

  document.getElementById('pagamento-total-rotulo').innerText = tipo === 'agencia' ? 'Saldo antes' : 'Total do dia';

  document.getElementById('pagamento-total').innerText = tipo === 'agencia'
    ? formatarMoeda(Math.abs(saldoAntes))
    : formatarMoeda(valorTotal);

  document.getElementById('pagamento-ja-pago-rotulo').innerText = tipo === 'agencia'
    ? 'Acertos na data'
    : (existente ? 'Outras parcelas' : 'Já pago');

  document.getElementById('pagamento-ja-pago').innerText = formatarMoeda(valorPagoOutros);

  document.getElementById('pagamento-saldo-rotulo').innerText = tipo === 'agencia' ? 'Situação' : 'Disponível';

  document.getElementById('pagamento-saldo').innerText = tipo === 'agencia'
    ? situacaoSaldoJardas(saldoAntes).texto
    : formatarMoeda(valorMaximo);

  const campoValor = document.getElementById('pagamento-valor-parcela');

  campoValor.value = valorInicial.toFixed(2);

  if (tipo === 'agencia') {
    campoValor.removeAttribute('max');
  } else {
    campoValor.max = valorMaximo.toFixed(2);
  }

  campoValor.min = '0.01';
  campoValor.readOnly = false;
  campoValor.classList.remove('bg-gray-100');

  atualizarPreviaPagamento();

  document.getElementById('pagamento-dica').innerText = tipo === 'catamara'
    ? 'Para pagamento parcial, digite uma parte do saldo. O restante continuará pendente nesta data.'
    : (saldoAntes < -0.009
        ? 'O Jardas está devendo. Este pagamento será registrado como valor recebido dele e abatido das dívidas mais antigas.'
        : (saldoAntes > 0.009
            ? 'Nós estamos devendo ao Jardas. Este pagamento será registrado como valor pago a ele e reduzirá esse saldo.'
            : 'O saldo está zerado e não há valor para abater.'));

  document.getElementById('pagamento-observacao').value = existente?.observacao || '';

  document.getElementById('pagamento-titulo').innerText = tipo === 'agencia'
    ? 'Registrar pagamento Jardas'
    : 'Registrar pagamento';

  document.getElementById('pagamento-subtitulo').innerText = tipo === 'agencia'
    ? 'Informe o valor pago. O saldo anterior será compensado automaticamente.'
    : 'Registre o valor pago agora. O restante poderá ser pago em outro dia.';

  const blocoSaldo = document.getElementById('saldo-prestacao-jardas');
  blocoSaldo.classList.toggle('hidden', tipo !== 'agencia');

  atualizarCampoSaldoPrestacao();

  document.getElementById('confirmar-pagamento').innerText = existente
    ? '💾 Atualizar pagamento'
    : '✅ Registrar pagamento';

  document.getElementById('modal-pagamento').classList.remove('hidden');

  setTimeout(() => {
    campoValor.focus();
    campoValor.select();
  }, 50);
}

function fecharModalPagamento() {
  pagamentoEmEdicao = null;

  document.getElementById('pagamento-valor-parcela').value = '';
  document.getElementById('pagamento-restante').innerText = '';
  document.getElementById('pagamento-observacao').value = '';
  document.getElementById('saldo-prestacao-tipo').value = '';
  document.getElementById('saldo-prestacao-valor').value = '';
  document.getElementById('saldo-prestacao-jardas').classList.add('hidden');

  atualizarCampoSaldoPrestacao();

  document.getElementById('modal-pagamento').classList.add('hidden');
}

function salvarPagamentoDiario() {
  if (!pagamentoEmEdicao) return;

  const observacao = document.getElementById('pagamento-observacao').value.trim();
  if (!observacao) return alert('Informe como o pagamento foi feito ou escreva uma observação.');

  const valorDigitado = String(document.getElementById('pagamento-valor-parcela').value).replace(',', '.');
  const valorPagamento = arredondar2(Number(valorDigitado));

  if (!Number.isFinite(valorPagamento) || valorPagamento <= 0) {
    return alert('Informe um valor de pagamento maior que zero.');
  }

  let saldoDeclaradoTipo = null;
  let saldoDeclaradoValor = 0;
  let efeitoSaldo = null;

  if (pagamentoEmEdicao.tipo === 'agencia') {
    const saldoAntesPagamento = calcularSaldoJardasAte(
      pagamentoEmEdicao.dataMovimento,
      pagamentoEmEdicao.prestacaoId
    );

    if (Math.abs(saldoAntesPagamento) < 0.01 && !pagamentoEmEdicao.prestacaoId) {
      return alert('O saldo com o Jardas já está zerado nesta data. Não há valor para abater.');
    }

    const saldoAutomatico = aplicarPagamentoAoSaldo(saldoAntesPagamento, valorPagamento);

    efeitoSaldo = arredondar2(saldoAutomatico - saldoAntesPagamento);

    saldoDeclaradoTipo = saldoAutomatico < -0.009
      ? 'jardas-deve'
      : (saldoAutomatico > 0.009 ? 'nos-devemos' : 'zerado');

    saldoDeclaradoValor = arredondar2(Math.abs(saldoAutomatico));
  }

  if (pagamentoEmEdicao.tipo !== 'agencia' && valorPagamento > pagamentoEmEdicao.valorMaximo + 0.009) {
    return alert(`O valor não pode ser maior que o saldo disponível de ${formatarMoeda(pagamentoEmEdicao.valorMaximo)}.`);
  }

  const botao = document.getElementById('confirmar-pagamento');
  botao.disabled = true;
  botao.innerText = 'Salvando...';

  const prestacaoExistente = pagamentoEmEdicao.prestacaoExistente;

  const saldoAposPagamento = pagamentoEmEdicao.tipo === 'agencia'
    ? saldoDeclaradoValor
    : arredondar2(Math.max(0, pagamentoEmEdicao.valorTotal - pagamentoEmEdicao.valorPagoOutros - valorPagamento));

  const prestacao = {
    tipo: pagamentoEmEdicao.tipo,
    nome: pagamentoEmEdicao.nome,
    dataMovimento: pagamentoEmEdicao.dataMovimento,
    periodoInicio: pagamentoEmEdicao.dataMovimento,
    periodoFim: pagamentoEmEdicao.dataMovimento,
    valor: valorPagamento,
    valorTotalMovimento: arredondar2(pagamentoEmEdicao.valorTotal),
    pagamentoParcial: saldoAposPagamento >= 0.01,
    statusPagamento: saldoAposPagamento < 0.01 ? 'quitado' : 'parcial',
    observacao,
    saldoDeclaradoTipo,
    saldoDeclaradoValor,
    efeitoSaldo,
    dataPrestacao: prestacaoExistente?.dataPrestacao || dataLocalHoje(),
    horaPrestacao: prestacaoExistente?.horaPrestacao || new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };

  const referencia = pagamentoEmEdicao.prestacaoId
    ? db.collection('prestacoes').doc(pagamentoEmEdicao.prestacaoId)
    : db.collection('prestacoes').doc();

  referencia.set(prestacao, { merge: true })
    .then(() => {
      fecharModalPagamento();

      const status = saldoAposPagamento < 0.01
        ? '✅ Esta data ficou quitada.'
        : `🟡 Pagamento parcial. Ainda faltam ${formatarMoeda(saldoAposPagamento)}.`;

      const saldoInformado = saldoDeclaradoTipo === 'zerado'
        ? 'Saldo final: zerado'
        : (saldoDeclaradoTipo === 'jardas-deve'
            ? `Saldo final: Jardas deve ${formatarMoeda(saldoDeclaradoValor)}`
            : `Saldo final: devemos ao Jardas ${formatarMoeda(saldoDeclaradoValor)}`);

      if (prestacao.tipo === 'agencia') {
        alert(`✅ Pagamento abatido no saldo!
Valor: ${formatarMoeda(valorPagamento)}
Data: ${formatarDataRelatorio(prestacao.dataMovimento)}
${saldoInformado}
Observação: ${observacao}`);
      } else {
        alert(`✅ Pagamento registrado!
${prestacao.nome}
Data do movimento: ${formatarDataRelatorio(prestacao.dataMovimento)}
Valor pago agora: ${formatarMoeda(prestacao.valor)}
${status}
Observação: ${observacao}`);
      }
    })
    .catch((error) => alert('Erro: ' + error.message))
    .finally(() => {
      botao.disabled = false;
      botao.innerText = '✅ Registrar pagamento';
    });
}

function zerarContasJardasAte(dataCorte) {
  if (!dataValidaISO(dataCorte)) return alert('Escolha uma data válida.');

  if (dataCorte > dataLocalHoje()) {
    return alert('Não é permitido fechar contas em uma data futura. Escolha hoje ou uma data anterior.');
  }

  const ultimoFechamento = dataUltimoFechamentoJardas();

  if (ultimoFechamento && dataCorte <= ultimoFechamento) {
    return alert(`As contas já estão zeradas até ${formatarDataRelatorio(ultimoFechamento)}. Escolha uma data posterior.`);
  }

  const saldoAtual = calcularSaldoJardasAte(dataCorte);
  const situacaoAtual = situacaoSaldoJardas(saldoAtual).texto;

  const mensagem = `Fechar e zerar todas as contas com o Jardas até ${formatarDataRelatorio(dataCorte)}?
Saldo que será compensado: ${situacaoAtual}.
O histórico não será apagado. Um fechamento ficará registrado e as contas seguintes começarão do zero.`;

  if (!confirm(mensagem)) return;

  const agora = new Date();

  db.collection('prestacoes').add({
    tipo: 'agencia',
    nome: 'Jardas',
    dataMovimento: dataCorte,
    periodoInicio: config.inicioCortesiasJardas,
    periodoFim: dataCorte,
    valor: 0,
    fechamentoGeral: true,
    saldoAntesFechamento: saldoAtual,
    saldoDeclaradoTipo: 'zerado',
    saldoDeclaradoValor: 0,
    statusPagamento: 'fechado',
    pagamentoParcial: false,
    observacao: `Contas compensadas e zeradas até ${formatarDataRelatorio(dataCorte)}`,
    dataPrestacao: dataLocalHoje(),
    horaPrestacao: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert(`✅ Contas zeradas até ${formatarDataRelatorio(dataCorte)}.
O fechamento foi salvo no histórico.`);
  }).catch((error) => alert('Erro ao fechar as contas: ' + error.message));
}

function detalheSaldoPrestacao(prestacao) {
  if (!prestacao || prestacao.tipo !== 'agencia' || !prestacao.saldoDeclaradoTipo) return '';

  if (prestacao.saldoDeclaradoTipo === 'zerado') {
    return '<div class="text-xs font-bold text-green-700 mt-1">⚖️ Saldo final: zerado</div>';
  }

  const texto = prestacao.saldoDeclaradoTipo === 'jardas-deve'
    ? 'Jardas ficou devendo'
    : 'Ficamos devendo ao Jardas';

  const cor = prestacao.saldoDeclaradoTipo === 'jardas-deve' ? 'text-red-700' : 'text-purple-700';

  return `<div class="text-xs font-bold ${cor} mt-1">⚖️ ${texto}: ${formatarMoeda(prestacao.saldoDeclaradoValor)}</div>`;
}

function descricaoPagamentoJardas(prestacao) {
  if (prestacao?.fechamentoGeral) return 'Contas zeradas';

  return valorAssinadoPagamentoJardas(prestacao) < 0
    ? 'Pagamento feito ao Jardas'
    : 'Pagamento recebido do Jardas';
}

function renderizarLinhaPagamentoDiario(tipo, nome, dataMovimento, valor, detalhes, baixaJardas = null) {
  const resumoPagamento = obterResumoPagamentoDiario(tipo, nome, dataMovimento, valor);

  const valorNumerico = arredondar2(Number(valor) || 0);

  const classeCartao = tipo === 'agencia' && baixaJardas
    ? (baixaJardas.quitado ? 'bg-green-50 border-green-300' : (baixaJardas.parcial ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50 border-gray-200'))
    : (resumoPagamento.quitado
        ? 'bg-green-50 border-green-300'
        : (resumoPagamento.parcial ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50 border-gray-200'));

  const status = tipo === 'agencia'
    ? (ehDataFechamentoJardas(dataMovimento)
        ? '<div class="text-xs text-green-700 font-bold">⚖️ Contas zeradas nesta data</div>'
        : (baixaJardas?.quitado
            ? `<div class="text-xs text-green-700 font-bold">✅ Dia quitado · Baixado ${formatarMoeda(baixaJardas.valorAbatido)}</div>`
            : (baixaJardas?.parcial
                ? `<div class="text-xs text-yellow-800 font-bold">🟡 Baixa parcial · Baixado ${formatarMoeda(baixaJardas.valorAbatido)} · Falta ${formatarMoeda(baixaJardas.restante)}</div>`
                : `<div class="text-xs text-orange-600 font-bold">○ Pendente · Falta ${formatarMoeda(baixaJardas?.restante || 0)}</div>`)))
    : (resumoPagamento.quitado
        ? `<div class="text-xs text-green-700 font-bold">✅ Quitado · Pago ${formatarMoeda(resumoPagamento.totalPago)}</div>`
        : (resumoPagamento.parcial
            ? `<div class="text-xs text-yellow-800 font-bold">🟡 Pagamento parcial · Pago ${formatarMoeda(resumoPagamento.totalPago)} · Falta ${formatarMoeda(resumoPagamento.saldoRestante)}</div>`
            : '<div class="text-xs text-orange-600 font-bold">○ Pagamento pendente</div>'));

  const avisoExcedente = tipo !== 'agencia' && resumoPagamento.excedente > 0.009
    ? `<div class="text-xs text-red-600 font-bold mt-1">⚠️ Pago a maior: ${formatarMoeda(resumoPagamento.excedente)}</div>`
    : '';

  const observacao = '';

  const listaParcelas = resumoPagamento.pagamentos.length > 0
    ? `<div class="mt-2 space-y-1">
        ${resumoPagamento.pagamentos.map(pagamento => {
          const idArgumento = escaparHTML(JSON.stringify(pagamento.id));

          const tituloPagamento = tipo === 'agencia'
            ? descricaoPagamentoJardas(pagamento)
            : `${formatarDataHistorico(pagamento.dataPrestacao)} ${escaparHTML(pagamento.horaPrestacao || '')}`;

          return `
            <div class="bg-white bg-opacity-70 rounded p-2 text-xs">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <div class="font-semibold text-gray-700">${escaparHTML(tituloPagamento)}</div>
                  <div class="text-gray-500">${formatarDataHistorico(pagamento.dataPrestacao)} ${escaparHTML(pagamento.horaPrestacao || '')}</div>
                  <div class="text-gray-600">💬 ${escaparHTML(pagamento.observacao || 'Pagamento antigo sem observação')}</div>
                  ${tipo === 'agencia' ? detalheSaldoPrestacao(pagamento) : ''}
                </div>
                <div class="text-right">
                  <div class="font-bold text-green-700">${formatarMoeda(pagamento.valor)}</div>
                  ${pagamento.fechamentoGeral ? '' : `<button type="button" onclick="abrirPagamentoDiario('${tipo}', ${escaparHTML(JSON.stringify(nome))}, '${dataMovimento}', ${valorNumerico}, ${idArgumento})" class="text-blue-700 font-semibold mt-1">✏️ Editar</button>`}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>`
    : '';

  let botao = valorNumerico > 0 && resumoPagamento.quitado
    ? '<div class="text-xs text-green-700 font-semibold mt-2">Nenhum saldo pendente nesta data.</div>'
    : '<div class="text-xs text-gray-400 mt-2">Sem valor a pagar nesta data.</div>';

  if (tipo === 'catamara' && valorNumerico > 0 && resumoPagamento.saldoRestante >= 0.01) {
    botao = `<button onclick="abrirPagamentoDiario('${tipo}', ${escaparHTML(JSON.stringify(nome))}, '${dataMovimento}', ${valorNumerico})" class="w-full mt-2 ${resumoPagamento.parcial ? 'bg-yellow-600' : 'bg-green-600'} text-white text-xs font-bold py-2 rounded-lg">
      ${resumoPagamento.parcial ? '➕ Registrar outra parte' : '💰 Pagar total ou parcial'}
    </button>`;
  } else if (tipo === 'agencia') {
    const ultimoFechamento = dataUltimoFechamentoJardas();

    botao = ultimoFechamento && dataMovimento <= ultimoFechamento
      ? `<div class="text-xs text-gray-600 font-semibold mt-2">⚖️ Contas fechadas até ${formatarDataRelatorio(ultimoFechamento)}</div>`
      : `<button onclick="abrirPagamentoDiario('${tipo}', ${escaparHTML(JSON.stringify(nome))}, '${dataMovimento}', ${valorNumerico})" class="w-full mt-2 bg-green-600 text-white text-xs font-bold py-2 rounded-lg">
          ➕ Registrar pagamento total ou parcial
        </button>`;
  } else if (valorNumerico > 0 && resumoPagamento.saldoRestante >= 0.01) {
    botao = `<button onclick="abrirPagamentoDiario('${tipo}', ${escaparHTML(JSON.stringify(nome))}, '${dataMovimento}', ${valorNumerico})" class="w-full mt-2 bg-green-600 text-white text-xs font-bold py-2 rounded-lg">
      ➕ Registrar pagamento total ou parcial
    </button>`;
  }

  return `
    <div class="border rounded-lg p-3 ${classeCartao}">
      <div class="flex justify-between items-start gap-2">
        <div>
          <div class="font-bold text-sm">${formatarDataRelatorio(dataMovimento)}</div>
          <div class="text-xs text-gray-500">${detalhes}</div>
        </div>
        ${tipo === 'agencia' ? '' : `<div class="font-bold text-green-700">${formatarMoeda(valorNumerico)}</div>`}
      </div>
      <div class="mt-2">${status}${avisoExcedente}</div>
      ${observacao}
      ${listaParcelas}
      ${botao}
    </div>
  `;
}

function dadosAuditoriaExclusao(tipo, registro) {
  const agora = new Date();
  const { id, ...dadosOriginais } = registro;

  return {
    tipo,
    registroIdOriginal: id,
    dados: dadosOriginais,
    usuario: usuarioAtual?.email || 'usuário autenticado',
    dataExclusao: dataLocalHoje(),
    horaExclusao: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };
}

function possuiPagamentoParaParte(tipo, nome, dataMovimento) {
  return prestacoes.some(p =>
    p.tipo === tipo &&
    mesmaPartePrestacao(tipo, p.nome, nome) &&
    (
      p.dataMovimento === dataMovimento ||
      (!p.dataMovimento && p.periodoInicio === dataMovimento && p.periodoFim === dataMovimento)
    )
  );
}

function excluirGuia(id) {
  if (!confirm('Excluir este guia?')) return;

  const registro = registrosGuias.find(item => item.id === id);
  if (!registro) return alert('Registro não encontrado. Atualize a tela e tente novamente.');

  if (ehAgenciaComissionada(registro.agencia) && possuiPagamentoParaParte('agencia', 'Jardas', registro.data)) {
    if (!confirm('Já existem pagamentos ou fechamentos da Jardas nesta data. Excluir este lançamento pode alterar o saldo. Deseja continuar mesmo assim?')) {
      return;
    }
  }

  const batch = db.batch();

  batch.set(db.collection('historicoExclusoes').doc(), dadosAuditoriaExclusao('guia', registro));
  batch.delete(db.collection('registrosGuias').doc(id));

  batch.commit()
    .then(() => {
      if (guiaEmEdicaoId === id) limparFormularioGuia();
    })
    .catch((error) => alert('Erro: ' + error.message));
}

function excluirBarco(id) {
  if (!confirm('Excluir esta embarcação?')) return;

  const registro = registrosEmbarcacoes.find(item => item.id === id);
  if (!registro) return alert('Registro não encontrado. Atualize a tela e tente novamente.');

  const nomeBarco = nomeCanonicoEmbarcacao(registro.catamaran);

  const possuiPagamentoCatamara = possuiPagamentoParaParte('catamara', nomeBarco, registro.data);
  const possuiPagamentoJacilene = mesmaEmbarcacao(nomeBarco, 'Velho Bill') &&
    possuiPagamentoParaParte('jacilene', 'Jacilene', registro.data);

  if (possuiPagamentoCatamara || possuiPagamentoJacilene) {
    if (!confirm('Já existem pagamentos ligados a esta data/embarcação. Excluir pode alterar saldos. Deseja continuar mesmo assim?')) {
      return;
    }
  }

  const batch = db.batch();

  batch.set(db.collection('historicoExclusoes').doc(), dadosAuditoriaExclusao('barco', registro));
  batch.delete(db.collection('registrosEmbarcacoes').doc(id));

  batch.commit()
    .catch((error) => alert('Erro: ' + error.message));
}

function atualizarTela() {
  cacheSaldoJardas.clear();
  vouchersJardas = {};

  const guiadosFiltrados = ordenarPorDataHora(
    registrosGuias.filter(e => e.data === dataGlobal)
  );

  const barcosFiltrados = ordenarPorDataHora(
    registrosEmbarcacoes.filter(e => e.data === dataGlobal)
  );

  const dataInicio = document.getElementById('dataInicio').value || dataLocalHoje();
  const dataFim = document.getElementById('dataFim').value || dataLocalHoje();

  const contasGuias = ordenarPorDataHora(
    registrosGuias.filter(e => dataValidaISO(e.data) && e.data >= dataInicio && e.data <= dataFim)
  );

  const contasBarcos = ordenarPorDataHora(
    registrosEmbarcacoes.filter(e => dataValidaISO(e.data) && e.data >= dataInicio && e.data <= dataFim)
  );

  // Lista Guias
  const listaGuias = document.getElementById('lista-guias');
  listaGuias.innerHTML = '';

  let totPaxGuias = 0;
  let totValorGuias = 0;
  let totAlmocoGuias = 0;
  let totComissaoGuias = 0;

  if (guiadosFiltrados.length === 0) {
